[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relic-cli"
version = "0.9.0"
description = "Shared project knowledge for coding agents"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["project-knowledge", "coding-agents", "ai", "llm", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
relic = "relic.__main__:main"

[project.urls]
Homepage = "https://github.com/filfp/relic"
Repository = "https://github.com/filfp/relic"

[tool.hatch.build.targets.wheel]
packages = ["relic"]
artifacts = ["relic/relic", "relic/relic.exe"]
