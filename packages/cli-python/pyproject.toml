[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "relic-cli"
version = "2.2.0"
description = "Shared project knowledge for coding agents"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["project-knowledge", "coding-agents", "ai", "llm", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
relic = "relic.__main__:main"

[project.urls]
Homepage = "https://github.com/filfp/relic"
Repository = "https://github.com/filfp/relic"

[tool.hatch.build.targets.wheel]
packages = ["relic"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
