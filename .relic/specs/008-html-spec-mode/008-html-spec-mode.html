<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="relic-base-version" content="2">
  <title>008-html-spec-mode — HTML Spec Mode</title>
  <style>
    /* ── CSS custom properties ────────────────────────────────────── */
    :root {
      --bg:        #f8fafc;
      --surface:   #ffffff;
      --surface-2: #f1f5f9;
      --border:    #e2e8f0;
      --border-2:  #cbd5e1;
      --text:      #1e293b;
      --text-2:    #475569;
      --text-3:    #94a3b8;
      --accent:    #3b82f6;
      --accent-bg: #eff6ff;
      --code-bg:   #f1f5f9;
      --hdr-h:     52px;
      /* tone palette — shared by badges, chips, callouts, flow nodes */
      --tone-slate-bg:#f1f5f9;  --tone-slate-bd:#cbd5e1;  --tone-slate-fg:#475569;
      --tone-blue-bg:#dbeafe;   --tone-blue-bd:#93c5fd;   --tone-blue-fg:#1d4ed8;
      --tone-green-bg:#dcfce7;  --tone-green-bd:#86efac;  --tone-green-fg:#15803d;
      --tone-amber-bg:#fef3c7;  --tone-amber-bd:#fde68a;  --tone-amber-fg:#92400e;
      --tone-red-bg:#fee2e2;    --tone-red-bd:#fca5a5;    --tone-red-fg:#b91c1c;
      --tone-purple-bg:#f3e8ff; --tone-purple-bd:#d8b4fe; --tone-purple-fg:#7c3aed;
    }
    [data-theme="dark"] {
      --bg:        #0f172a;
      --surface:   #1e293b;
      --surface-2: #263248;
      --border:    #334155;
      --border-2:  #475569;
      --text:      #e2e8f0;
      --text-2:    #94a3b8;
      --text-3:    #64748b;
      --accent:    #60a5fa;
      --accent-bg: #1e3a5f;
      --code-bg:   #263248;
      --tone-slate-bg:#263248;  --tone-slate-bd:#475569;  --tone-slate-fg:#94a3b8;
      --tone-blue-bg:#1e3a5f;   --tone-blue-bd:#2f5d9e;   --tone-blue-fg:#93c5fd;
      --tone-green-bg:#14331f;  --tone-green-bd:#1f6f43;  --tone-green-fg:#86efac;
      --tone-amber-bg:#362a10;  --tone-amber-bd:#8a6410;  --tone-amber-fg:#fcd34d;
      --tone-red-bg:#3b1a1e;    --tone-red-bd:#8a2b33;    --tone-red-fg:#fca5a5;
      --tone-purple-bg:#2b1d44; --tone-purple-bd:#6d3fb8; --tone-purple-fg:#d8b4fe;
    }

    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 15px; line-height: 1.65;
      color: var(--text); background: var(--bg);
      padding-top: var(--hdr-h);
      transition: background 0.2s, color 0.2s;
    }

    /* ── Sticky header ────────────────────────────────────────────── */
    #relic-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--hdr-h);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 1.25rem; gap: 0.75rem;
      box-shadow: 0 1px 6px rgba(0,0,0,.06);
    }
    #relic-header .h-id {
      font-family: ui-monospace, monospace; font-size: 0.72rem; font-weight: 700;
      color: var(--accent); background: var(--accent-bg);
      padding: 2px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
    }
    #relic-header .h-title {
      font-size: 0.88rem; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    #relic-header .h-nav {
      display: flex; gap: 0.2rem; flex-shrink: 0;
    }
    #relic-header .h-link {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 3px 10px; border-radius: 5px; font-size: 0.76rem; font-weight: 500;
      color: var(--text-2); text-decoration: none;
      border: 1px solid var(--border); background: var(--surface-2);
      transition: all 0.15s; white-space: nowrap;
    }
    #relic-header .h-link:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
    #relic-header .h-toggle {
      background: none; border: 1px solid var(--border);
      border-radius: 5px; padding: 3px 9px; cursor: pointer;
      font-size: 0.95rem; line-height: 1.4; color: var(--text-2);
      transition: background 0.15s; flex-shrink: 0;
    }
    #relic-header .h-toggle:hover { background: var(--surface-2); }

    /* ── Layout ───────────────────────────────────────────────────── */
    #relic-body, #relic-reader-wrap { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

    /* ── Typography ───────────────────────────────────────────────── */
    h1 { font-size: 1.55rem; font-weight: 700; color: var(--text); margin-bottom: 0.3rem; }
    h2 {
      font-size: 1.05rem; font-weight: 600; color: var(--text);
      margin: 2rem 0 0.7rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--border);
    }
    h3 { font-size: 0.92rem; font-weight: 600; color: var(--text-2); margin: 1.1rem 0 0.35rem; }
    p  { margin-bottom: 0.6rem; }
    a  { color: var(--accent); }
    code {
      font-family: ui-monospace, 'Cascadia Code', monospace; font-size: 0.82em;
      background: var(--code-bg); padding: 0.1em 0.4em; border-radius: 3px; color: var(--text);
    }
    pre {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 1rem; border-radius: 8px; overflow-x: auto;
      font-size: 0.81rem; margin: 0.75rem 0; line-height: 1.55;
    }
    pre code { background: none; padding: 0; font-size: inherit; }
    ul, ol { padding-left: 1.5rem; margin-bottom: 0.6rem; }
    li { margin-bottom: 0.2rem; }

    /* ── Cards ────────────────────────────────────────────────────── */
    section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem;
    }
    section > h2:first-child { margin-top: 0; }

    /* ── Meta ─────────────────────────────────────────────────────── */
    .meta {
      display: flex; gap: 1.25rem; flex-wrap: wrap; align-items: center;
      color: var(--text-3); font-size: 0.8rem; margin-bottom: 1.5rem;
    }

    /* ── Table ────────────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 0.865rem; }
    th {
      text-align: left; padding: 0.45rem 0.75rem;
      background: var(--surface-2); border-bottom: 2px solid var(--border);
      font-weight: 600; color: var(--text-2); white-space: nowrap;
    }
    td { padding: 0.45rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:nth-child(even) td { background: var(--surface-2); }
    tr:last-child td { border-bottom: none; }

    /* ── Relic components (theme-aware via tone vars) ─────────────── */
    .rl-tone-slate  { background: var(--tone-slate-bg);  border-color: var(--tone-slate-bd);  color: var(--tone-slate-fg); }
    .rl-tone-blue   { background: var(--tone-blue-bg);   border-color: var(--tone-blue-bd);   color: var(--tone-blue-fg); }
    .rl-tone-green  { background: var(--tone-green-bg);  border-color: var(--tone-green-bd);  color: var(--tone-green-fg); }
    .rl-tone-amber  { background: var(--tone-amber-bg);  border-color: var(--tone-amber-bd);  color: var(--tone-amber-fg); }
    .rl-tone-red    { background: var(--tone-red-bg);    border-color: var(--tone-red-bd);    color: var(--tone-red-fg); }
    .rl-tone-purple { background: var(--tone-purple-bg); border-color: var(--tone-purple-bd); color: var(--tone-purple-fg); }
    .rl-badge {
      display: inline-block; padding: 2px 10px; border-radius: 9999px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em; border: 1px solid;
    }
    .rl-chip {
      display: inline-block; padding: 1px 7px; border-radius: 4px;
      font-size: 0.72rem; font-weight: 600; font-family: ui-monospace, monospace; border: 1px solid;
    }
    relic-callout { display: block; }
    .rl-callout {
      border: 1px solid; border-left: 4px solid; border-radius: 7px;
      padding: 0.75rem 1rem; margin: 0.6rem 0; color: var(--text);
    }
    .rl-callout-info    { background: var(--tone-blue-bg);  border-color: var(--tone-blue-bd);  border-left-color: #3b82f6; }
    .rl-callout-warn    { background: var(--tone-amber-bg); border-color: var(--tone-amber-bd); border-left-color: #f59e0b; }
    .rl-callout-risk    { background: var(--tone-red-bg);   border-color: var(--tone-red-bd);   border-left-color: #f43f5e; }
    .rl-callout-success { background: var(--tone-green-bg); border-color: var(--tone-green-bd); border-left-color: #22c55e; }
    .rl-ico { font-weight: 700; margin-right: 0.5rem; font-size: 0.88em; }
    .rl-callout-info    > .rl-ico { color: #3b82f6; }
    .rl-callout-warn    > .rl-ico { color: #f59e0b; }
    .rl-callout-risk    > .rl-ico { color: #f43f5e; }
    .rl-callout-success > .rl-ico { color: #22c55e; }
    relic-progress { display: block; margin: 0.5rem 0; }
    .rl-track { background: var(--surface-2); border-radius: 9999px; height: 8px; overflow: hidden; }
    .rl-track-label { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-2); margin-bottom: 5px; }
    relic-table { display: block; overflow-x: auto; margin: 0.5rem 0; }
    relic-chart, relic-flow { display: block; margin: 0.5rem 0; }
    /* SVG theming — CSS wins over presentation attributes, so fixed-colour
       text inside charts uses inline style="fill:..." instead of these classes */
    .rl-t-muted  { fill: var(--text-2); }
    .rl-t-strong { fill: var(--text); }
    .rl-grid     { stroke: var(--border); }
    .rl-edge     { stroke: var(--text-3); }
    .rl-arrow    { fill: var(--text-3); }
    .rl-node-box     { fill: var(--tone-blue-bg);  stroke: var(--tone-blue-bd); }
    .rl-node-diamond { fill: var(--tone-amber-bg); stroke: var(--tone-amber-bd); }
    .rl-node-circle  { fill: var(--tone-green-bg); stroke: var(--tone-green-bd); }

    /* ── Utility classes ──────────────────────────────────────────── */
    .flex        { display: flex; }
    .flex-wrap   { flex-wrap: wrap; }
    .gap-2       { gap: 0.5rem; }
    .gap-4       { gap: 1rem; }
    .items-center{ align-items: center; }
    .justify-between { justify-content: space-between; }
    .text-sm     { font-size: 0.875rem; }
    .text-xs     { font-size: 0.75rem; }
    .font-mono   { font-family: ui-monospace, monospace; }
    .text-muted  { color: var(--text-2); }
    .text-subtle { color: var(--text-3); }
    .text-red    { color: #dc2626; }
    .text-green  { color: #16a34a; }
    .text-blue   { color: var(--accent); }
    .text-amber  { color: #d97706; }
    .mt-1 { margin-top: 0.25rem; }  .mt-2 { margin-top: 0.5rem; }  .mt-4 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.25rem; }.mb-2 { margin-bottom: 0.5rem; }.mb-4 { margin-bottom: 1rem; }
    .p-2  { padding: 0.5rem; }      .p-4  { padding: 1rem; }
    .rounded    { border-radius: 4px; }
    .rounded-md { border-radius: 6px; }
    .rounded-full{ border-radius: 9999px; }
    .border     { border: 1px solid var(--border); }
    .bg-surface { background: var(--surface); }
    .bg-surface-2{ background: var(--surface-2); }
    .w-full     { width: 100%; }
    .overflow-auto { overflow: auto; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }

    /* ── Markdown reader ──────────────────────────────────────────────── */
    #relic-reader { padding: 0.5rem 0 3rem; }
    #relic-reader h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); border-bottom: 2px solid var(--border); padding-bottom: 0.4rem; margin-bottom: 1.25rem; }
    #relic-reader h2 { font-size: 1.1rem; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; margin: 1.75rem 0 0.75rem; }
    #relic-reader h3 { font-size: 0.95rem; font-weight: 600; color: var(--text-2); margin: 1.25rem 0 0.5rem; }
    #relic-reader h4 { font-size: 0.875rem; font-weight: 600; color: var(--text-2); margin: 1rem 0 0.35rem; }
    #relic-reader p  { margin-bottom: 0.75rem; }
    #relic-reader ul, #relic-reader ol { padding-left: 1.5rem; margin-bottom: 0.75rem; }
    #relic-reader li { margin-bottom: 0.25rem; }
    #relic-reader li.rl-task { list-style: none; margin-left: -1.25rem; }
    #relic-reader li.rl-task input { margin-right: 0.4rem; accent-color: var(--accent); vertical-align: -1px; }
    #relic-reader blockquote { border-left: 3px solid var(--accent); background: var(--accent-bg); color: var(--text-2); padding: 0.5rem 1rem; margin: 0.75rem 0; border-radius: 0 6px 6px 0; }
    #relic-reader blockquote p { margin-bottom: 0; }
    #relic-reader hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    #relic-reader table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.875rem; }
    #relic-reader th { text-align: left; padding: 0.4rem 0.75rem; background: var(--surface-2); border-bottom: 2px solid var(--border); font-weight: 600; color: var(--text-2); }
    #relic-reader td { padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    #relic-reader tr:nth-child(even) td { background: var(--surface-2); }
    #relic-reader tr:last-child td { border-bottom: none; }
    #relic-reader .reader-msg { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-top: 1rem; }
    /* back button — hidden by default, shown in reader mode */
    .h-back { display: none; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>

<!--
  RELIC COMPONENTS REFERENCE
  ==========================
  Stored in a <template> element below — inert, never rendered.
  The LLM reads #relic-docs before authoring any spec/fix HTML section.
  Using <template> (not an HTML comment) prevents --> sequences in examples from
  breaking the document structure.
-->
<template id="relic-docs">
RELIC COMPONENTS
================
All components are custom elements. Use them anywhere inside <body>.
They render after DOMContentLoaded — never rely on their generated markup;
author only the source form shown below.

RELIC-STATUS  — coloured status badge
  <relic-status value="pending">Pending</relic-status>
  <relic-status value="in-progress">In Progress</relic-status>
  <relic-status value="done">Done</relic-status>
  <relic-status value="risk">Risk</relic-status>
  <relic-status value="draft">Draft</relic-status>
  Values: pending (slate), in-progress (blue), done (green), risk (red), draft (purple)

RELIC-CHIP  — compact inline metadata tag (code/label style)
  <relic-chip>tag</relic-chip>
  <relic-chip color="blue">spec-008</relic-chip>
  <relic-chip color="green">done</relic-chip>
  Colors: default (slate), blue, green, amber, red, purple

RELIC-CALLOUT  — highlighted block
  <relic-callout type="info">Informational message</relic-callout>
  <relic-callout type="warn">Warning message</relic-callout>
  <relic-callout type="risk">Risk / error message</relic-callout>
  <relic-callout type="success">Success message</relic-callout>

RELIC-PROGRESS  — labelled numeric progress bar (colour tracks completion)
  <relic-progress value="7" max="12" label="Tasks complete"></relic-progress>

RELIC-TABLE  — structured table from JSON
  <relic-table
    headers='["Column A","Column B","Column C"]'
    rows='[["r1a","r1b","r1c"],["r2a","r2b","r2c"]]'>
  </relic-table>
  Note: cell content is rendered as HTML — wrap plain text in <code> tags if needed.

RELIC-CHART  — SVG chart
  Bar:  <relic-chart type="bar"  labels='["A","B","C"]' data='[10,20,15]' title="Title"></relic-chart>
  Pie:  <relic-chart type="pie"  labels='["X","Y","Z"]' data='[40,35,25]' title="Split"></relic-chart>
  Line: <relic-chart type="line" labels='["Jan","Feb","Mar"]' data='[5,8,6]' title="Trend"></relic-chart>

RELIC-FLOW  — flow diagram (Mermaid-style graph syntax)
  <relic-flow>
  graph TD
  A[Start] --> B{Decision?}
  B -->|yes| C[Done]
  B -->|no| D[Retry]
  D --> B
  </relic-flow>
  Directions: TD (top-down)  LR (left-right)  RL  BT
  Node shapes: [box]  {diamond}  (circle)
  Edges: A --> B   A -->|label| B   A --- B

CSS UTILITIES (add as class= on any element)
  Spacing:  mt-1/2/4  mb-1/2/4  p-2/4  gap-2/4
  Text:     text-sm  text-xs  font-mono  text-muted  text-subtle
            text-red  text-green  text-blue  text-amber
  Layout:   flex  flex-wrap  items-center  justify-between  w-full
            grid-2  grid-3
  Visual:   border  rounded  rounded-md  bg-surface  bg-surface-2  overflow-auto
  Cards:    use <section> for a white card with border, rounded corners, padding

HEADER & DARK MODE
  The sticky header contains:
    • spec ID chip (left)
    • spec title (centre-left)
    • nav links: spec.md  plan.md  tasks.md — clicking opens the file INLINE (not raw text)
    • back button (hidden; shown when a .md file is open in the reader panel)
    • dark mode toggle (right) — persisted in localStorage
  All colours use CSS custom properties (--bg, --surface, --text, --border, --accent, etc.)
  so any custom CSS the LLM adds automatically inherits dark-mode support when it uses var(--*).

INLINE MARKDOWN READER
  The nav links open .md files in a styled reader panel within the same page.
  The reader reads from three embedded <script type="text/plain"> source blocks:
    #relic-src-spec   ← content of spec.md
    #relic-src-plan   ← content of plan.md
    #relic-src-tasks  ← content of tasks.md
  If a source block is empty, the reader falls back to fetch() (works on HTTP;
  blocked in Chrome on file:// due to CORS). If both fail, a graceful message is shown.

  The Relic CLI refreshes these blocks from the markdown files on every
  `relic scaffold` / `relic html-sync` run. LLM OBLIGATION: if you edit spec.md,
  plan.md, or tasks.md mid-session AFTER the scaffold step, re-embed the updated
  content into the matching source block so the reader stays current. This is the
  primary delivery path for the reader — fetch() is only a fallback.

  ESCAPING RULE (mandatory): if the markdown contains a closing script tag
  (the character "<" immediately followed by "/script"), it MUST be written
  with a backslash between "<" and "/" — i.e. "<\/script" — inside the source
  blocks, or it would terminate the block and break the page. The reader
  converts "<\/script" back before parsing. Nothing else needs escaping.

MACHINE-MANAGED CHROME (do not edit)
  Two pairs of HTML comments mark the authorable regions of this file:
    "relic:sources:start" … "relic:sources:end"   (the embedded markdown blocks)
    "relic:content:start" … "relic:content:end"   (the #relic-body sections)
  Everything OUTSIDE those pairs is chrome: styles, component script, header,
  reader script. It is owned by the Relic CLI and refreshed by `relic html-sync` /
  `relic scaffold` — any manual edit to chrome will be overwritten. Author content
  ONLY inside the marked regions. (Never write those marker comments anywhere else
  in the file — the sync tool locates the regions by their first occurrence.)

LLM AUTHORING RULES
  1. DO NOT copy Markdown text verbatim into HTML.
  2. Each section MUST synthesise content into the most visual form available:
       flow diagram instead of a bulleted list of steps
       table instead of prose describing columns of data
       progress bar instead of "3 of 5 tasks complete"
       relic-chip badges for inline metadata instead of parenthetical text
  3. If a section would look identical to the Markdown source, you are doing it wrong.
  4. Prefer relic-* components over raw HTML. Use raw HTML only for layouts (grid, flex).
  5. Use CSS custom properties (var(--text), var(--surface), etc.) for any custom styles
     so they work in both light and dark modes.
  6. Always populate the three relic-src-* source blocks (see INLINE MARKDOWN READER above).
  7. Never edit chrome (see MACHINE-MANAGED CHROME above).
</template>

<script>
(function() {

  /* ── Dark mode ──────────────────────────────────────────────────── */
  const THEME_KEY = 'relic-theme';
  function getTheme() {
    return localStorage.getItem(THEME_KEY) ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem(THEME_KEY, t);
    const btn = document.getElementById('relic-toggle');
    if (btn) btn.textContent = t === 'dark' ? '☀' : '🌙';
  }
  applyTheme(getTheme());
  document.addEventListener('DOMContentLoaded', () => {
    applyTheme(getTheme());
    document.getElementById('relic-toggle')?.addEventListener('click', () =>
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
  });

  /* ── Component definition helper ────────────────────────────────────
     connectedCallback fires DURING streaming parse, BEFORE the element's
     children exist — reading textContent/innerHTML there sees nothing.
     Defer rendering until DOMContentLoaded while the document is loading,
     and guard against double-rendering (e.g. content cloned or re-parsed
     after components already rendered). */
  function defineRelic(name, render) {
    customElements.define(name, class extends HTMLElement {
      connectedCallback() {
        const el = this;
        const go = () => {
          if (!el.isConnected || el.dataset.relicRendered) return;
          el.dataset.relicRendered = '1';
          render(el);
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', go, { once: true });
        } else {
          go();
        }
      }
    });
  }

  /* ── relic-status ───────────────────────────────────────────────── */
  const STATUS_TONE = { pending:'slate', 'in-progress':'blue', done:'green', risk:'red', draft:'purple' };
  defineRelic('relic-status', el => {
    const v = (el.getAttribute('value')||'pending').toLowerCase();
    const tone = STATUS_TONE[v] || 'slate';
    const label = el.textContent.trim() || v;
    el.textContent = '';
    const span = document.createElement('span');
    span.className = `rl-badge rl-tone-${tone}`;
    span.textContent = label;
    el.appendChild(span);
  });

  /* ── relic-chip ─────────────────────────────────────────────────── */
  const CHIP_TONES = new Set(['blue','green','amber','red','purple']);
  defineRelic('relic-chip', el => {
    const c = (el.getAttribute('color')||'').toLowerCase();
    const tone = CHIP_TONES.has(c) ? c : 'slate';
    const label = el.textContent.trim();
    el.textContent = '';
    const span = document.createElement('span');
    span.className = `rl-chip rl-tone-${tone}`;
    span.textContent = label;
    el.appendChild(span);
  });

  /* ── relic-callout ──────────────────────────────────────────────── */
  const CALLOUT_ICON = { info:'ℹ', warn:'⚠', risk:'✕', success:'✓' };
  defineRelic('relic-callout', el => {
    let t = (el.getAttribute('type')||'info').toLowerCase();
    if (!(t in CALLOUT_ICON)) t = 'info';
    el.classList.add('rl-callout', `rl-callout-${t}`);
    const icon = document.createElement('span');
    icon.className = 'rl-ico';
    icon.textContent = CALLOUT_ICON[t];
    el.insertBefore(icon, el.firstChild);
  });

  /* ── relic-progress ─────────────────────────────────────────────── */
  defineRelic('relic-progress', el => {
    const val = parseInt(el.getAttribute('value')||'0',10);
    const max = parseInt(el.getAttribute('max')||'100',10);
    const label = el.getAttribute('label')||'';
    const pct = max > 0 ? Math.round((val/max)*100) : 0;
    const color = pct===100 ? '#22c55e' : pct>=60 ? '#3b82f6' : pct>=30 ? '#f59e0b' : '#ef4444';
    el.innerHTML = `
      <div class="rl-track-label">
        <span></span><span style="font-weight:700;color:${color}"></span>
      </div>
      <div class="rl-track">
        <div style="background:${color};height:100%;border-radius:9999px;width:${pct}%;transition:width 0.4s ease"></div>
      </div>`;
    const spans = el.querySelectorAll('.rl-track-label span');
    spans[0].textContent = label;
    spans[1].textContent = `${pct}%`;
  });

  /* ── relic-table ────────────────────────────────────────────────── */
  defineRelic('relic-table', el => {
    let headers, rows;
    try { headers = JSON.parse(el.getAttribute('headers')||'[]'); } catch { headers=[]; }
    try { rows = JSON.parse(el.getAttribute('rows')||'[]'); } catch { rows=[]; }
    const t = document.createElement('table');
    if (headers.length) {
      const tr = t.createTHead().insertRow();
      headers.forEach(h => { const th=document.createElement('th'); th.textContent=h; tr.appendChild(th); });
    }
    const tbody = t.createTBody();
    rows.forEach(row => {
      const tr = tbody.insertRow();
      (Array.isArray(row)?row:[row]).forEach(cell => { tr.insertCell().innerHTML = String(cell??''); });
    });
    el.innerHTML = '';
    el.appendChild(t);
  });

  /* ── relic-chart ────────────────────────────────────────────────── */
  defineRelic('relic-chart', el => {
    const type = el.getAttribute('type')||'bar';
    const title = el.getAttribute('title')||'';
    let labels, data;
    try { labels=JSON.parse(el.getAttribute('labels')||'[]'); } catch { labels=[]; }
    try { data=JSON.parse(el.getAttribute('data')||'[]'); } catch { data=[]; }

    const W=500, H=280, PAD={top:40,right:20,bottom:64,left:52};
    const CW=W-PAD.left-PAD.right, CH=H-PAD.top-PAD.bottom;
    const nums=data.map(Number);
    const maxVal=Math.max(...nums,1);
    const COLORS=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316','#84cc16'];

    const mk=(tag,attrs={})=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e;};
    /* theme-aware text uses class (CSS fill); fixed-colour text uses style so it
       beats class rules regardless of specificity */
    const tx=(x,y,txt,a={})=>{
      const attrs={x,y,'font-size':'11','font-family':'system-ui',...a};
      if(!attrs.style&&!attrs.class) attrs.class='rl-t-muted';
      const e=mk('text',attrs);e.textContent=txt;return e;
    };
    const root=mk('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:'max-width:500px;display:block'});
    if(title) root.appendChild(tx(W/2,22,title,{'text-anchor':'middle','font-size':'14','font-weight':'600',class:'rl-t-strong'}));

    if(type==='bar'){
      const barW=Math.max(8,CW/Math.max(nums.length,1)*0.55), gap=CW/Math.max(nums.length,1);
      [0.25,0.5,0.75,1].forEach(n=>root.appendChild(mk('line',{x1:PAD.left,y1:PAD.top+CH-(n*CH),x2:PAD.left+CW,y2:PAD.top+CH-(n*CH),class:'rl-grid','stroke-width':'1'})));
      root.appendChild(mk('line',{x1:PAD.left,y1:PAD.top+CH,x2:PAD.left+CW,y2:PAD.top+CH,class:'rl-grid','stroke-width':'1'}));
      nums.forEach((v,i)=>{
        const bh=(v/maxVal)*CH, x=PAD.left+i*gap+gap/2-barW/2, y=PAD.top+CH-bh;
        root.appendChild(mk('rect',{x,y,width:barW,height:bh,fill:COLORS[i%COLORS.length],rx:'3'}));
        root.appendChild(tx(x+barW/2,PAD.top+CH+16,labels[i]||'',{'text-anchor':'middle','font-size':'10'}));
        if(v>0) root.appendChild(tx(x+barW/2,y-5,v,{'text-anchor':'middle','font-size':'10'}));
      });
    } else if(type==='line'){
      const pts=nums.map((v,i)=>[PAD.left+(i/Math.max(nums.length-1,1))*CW, PAD.top+CH-(v/maxVal)*CH]);
      root.appendChild(mk('line',{x1:PAD.left,y1:PAD.top+CH,x2:PAD.left+CW,y2:PAD.top+CH,class:'rl-grid','stroke-width':'1'}));
      if(pts.length>1){
        const areaD=`M${pts[0][0]},${PAD.top+CH} ${pts.map(p=>`L${p[0]},${p[1]}`).join(' ')} L${pts[pts.length-1][0]},${PAD.top+CH} Z`;
        root.appendChild(mk('path',{d:areaD,fill:COLORS[0]+'28',stroke:'none'}));
        root.appendChild(mk('path',{d:pts.map((p,i)=>`${i===0?'M':'L'}${p[0]},${p[1]}`).join(' '),stroke:COLORS[0],'stroke-width':'2.5',fill:'none','stroke-linejoin':'round','stroke-linecap':'round'}));
      }
      pts.forEach(([x,y],i)=>{
        root.appendChild(mk('circle',{cx:x,cy:y,r:'4',style:'fill:var(--surface)',stroke:COLORS[0],'stroke-width':'2'}));
        root.appendChild(tx(x,PAD.top+CH+16,labels[i]||'',{'text-anchor':'middle','font-size':'10'}));
      });
    } else if(type==='pie'){
      const total=nums.reduce((a,b)=>a+b,0)||1;
      const cx=W/2, cy=PAD.top+CH/2, r=Math.min(CW,CH)/2-8;
      let angle=-Math.PI/2;
      nums.forEach((v,i)=>{
        const sweep=(v/total)*2*Math.PI;
        const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
        const x2=cx+r*Math.cos(angle+sweep),y2=cy+r*Math.sin(angle+sweep);
        root.appendChild(mk('path',{d:`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${sweep>Math.PI?1:0},1 ${x2},${y2} Z`,fill:COLORS[i%COLORS.length],stroke:'var(--surface, #fff)','stroke-width':'2'}));
        const midA=angle+sweep/2;
        root.appendChild(tx(cx+(r*0.65)*Math.cos(midA),cy+(r*0.65)*Math.sin(midA),`${Math.round((v/total)*100)}%`,{'text-anchor':'middle',style:'fill:#fff','font-weight':'700','font-size':'11'}));
        angle+=sweep;
      });
      nums.forEach((_,i)=>{
        const ly=PAD.top+CH+14+Math.floor(i/3)*18, lx=PAD.left+(i%3)*140;
        root.appendChild(mk('rect',{x:lx,y:ly-8,width:10,height:10,fill:COLORS[i%COLORS.length],rx:'2'}));
        root.appendChild(tx(lx+14,ly,labels[i]||'',{}));
      });
    }
    el.innerHTML=''; el.appendChild(root);
  });

  /* ── relic-flow ─────────────────────────────────────────────────── */
  defineRelic('relic-flow', el => {
    const src = el.textContent.trim();
    el.innerHTML = '';
    if (!src) return;
    try {
      const svg = renderFlow(src);
      if (!svg) throw new Error('no nodes parsed');
      el.appendChild(svg);
    } catch(e) {
      const p = document.createElement('pre');
      p.textContent = src;
      el.appendChild(p);
    }
  });

  function renderFlow(src) {
    const lines = src.split('\n').map(l=>l.trim()).filter(Boolean);
    let dir = 'LR';
    const dm = lines[0]?.match(/^(?:graph|flowchart)\s+(LR|TD|RL|BT)/i);
    if (dm) dir = dm[1].toUpperCase();

    const nodes = new Map(); // id -> { label, shape }
    const edges = [];        // { from, to, label }
    const parseNode = (id, label, shape) => {
      if (!nodes.has(id)) nodes.set(id, { label: label??id, shape: shape??'box' });
      else if (label) nodes.get(id).label = label;
    };

    for (const line of lines.slice(1)) {
      if (/-{2,}>?/.test(line)) {
        const fromM = line.match(/^([A-Za-z0-9_]+)(?:\[([^\]]*)\]|\{([^}]*)\}|\(([^)]*)\))?/);
        const toM   = line.match(/-{2,}>?\s*(?:\|[^|]*\|)?\s*([A-Za-z0-9_]+)(?:\[([^\]]*)\]|\{([^}]*)\}|\(([^)]*)\))?/);
        if (fromM && toM) {
          const [,fId,fBox,fDiam,fCirc] = fromM;
          const [,tId,tBox,tDiam,tCirc] = toM;
          parseNode(fId, fBox??fDiam??fCirc, fDiam?'diamond':fCirc?'circle':'box');
          parseNode(tId, tBox??tDiam??tCirc, tDiam?'diamond':tCirc?'circle':'box');
          const lblM = line.match(/\|([^|]*)\|/);
          edges.push({ from:fId, to:tId, label:lblM?lblM[1]:'' });
          continue;
        }
      }
      const nm = line.match(/^([A-Za-z0-9_]+)(?:\[([^\]]*)\]|\{([^}]*)\}|\(([^)]*)\))?$/);
      if (nm) parseNode(nm[1], nm[2]??nm[3]??nm[4], nm[3]?'diamond':nm[4]?'circle':'box');
    }

    if (!nodes.size) return null;

    const horiz = dir==='LR'||dir==='RL';
    const nodeW=120, nodeH=38, rankGap=horiz?150:90, nodeGap=horiz?72:136;
    const ranks = rankNodes(nodes, edges);
    const rankGroups = new Map();
    nodes.forEach((_,id) => { const r=ranks.get(id)??0; if(!rankGroups.has(r))rankGroups.set(r,[]); rankGroups.get(r).push(id); });
    const pos = new Map();
    let svgW=0, svgH=0;
    rankGroups.forEach((ids,rank) => {
      ids.forEach((id,i) => {
        const x=horiz?rank*rankGap+24:i*nodeGap+24, y=horiz?i*nodeGap+24:rank*rankGap+24;
        pos.set(id,{x,y});
        svgW=Math.max(svgW,x+nodeW+40); svgH=Math.max(svgH,y+nodeH+60);
      });
    });

    const mk=(tag,attrs={})=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e;};
    const root=mk('svg',{width:'100%',viewBox:`0 0 ${svgW} ${svgH}`,style:'max-width:640px;display:block;overflow:visible'});
    const defs=mk('defs');
    const marker=mk('marker',{id:'farr',markerWidth:'8',markerHeight:'8',refX:'7',refY:'3',orient:'auto'});
    const ap=mk('path',{d:'M0,0 L0,6 L8,3 z',class:'rl-arrow'});
    marker.appendChild(ap); defs.appendChild(marker); root.appendChild(defs);

    edges.forEach(({from,to,label}) => {
      const fp=pos.get(from),tp=pos.get(to); if(!fp||!tp) return;
      const x1=fp.x+nodeW/2,y1=fp.y+nodeH/2,x2=tp.x+nodeW/2,y2=tp.y+nodeH/2;
      root.appendChild(mk('line',{x1,y1,x2,y2,class:'rl-edge','stroke-width':'1.5','marker-end':'url(#farr)'}));
      if(label){const lt=mk('text',{x:(x1+x2)/2,y:(y1+y2)/2-6,'text-anchor':'middle','font-size':'10','font-family':'system-ui',class:'rl-t-muted'});lt.textContent=label;root.appendChild(lt);}
    });

    nodes.forEach(({label,shape},id)=>{
      const p=pos.get(id); if(!p) return;
      const {x,y}=p,cx=x+nodeW/2,cy=y+nodeH/2;
      if(shape==='diamond'){root.appendChild(mk('polygon',{points:`${cx},${y} ${x+nodeW-2},${cy} ${cx},${y+nodeH} ${x+2},${cy}`,class:'rl-node-diamond','stroke-width':'1.5'}));}
      else if(shape==='circle'){root.appendChild(mk('ellipse',{cx,cy,rx:nodeW/2,ry:nodeH/2,class:'rl-node-circle','stroke-width':'1.5'}));}
      else{root.appendChild(mk('rect',{x:x+2,y,width:nodeW-4,height:nodeH,rx:'6',class:'rl-node-box','stroke-width':'1.5'}));}
      const t=mk('text',{x:cx,y:cy+4,'text-anchor':'middle','font-size':'12','font-family':'system-ui',class:'rl-t-strong'});
      t.textContent=label.length>18?label.slice(0,16)+'…':label;
      root.appendChild(t);
    });
    return root;
  }

  function rankNodes(nodes, edges) {
    const inDeg=new Map([...nodes.keys()].map(id=>[id,0]));
    edges.forEach(({to})=>inDeg.set(to,(inDeg.get(to)??0)+1));
    const adj=new Map([...nodes.keys()].map(id=>[id,[]]));
    edges.forEach(({from,to})=>adj.get(from)?.push(to));
    const ranks=new Map();
    const q=[...nodes.keys()].filter(id=>(inDeg.get(id)??0)===0);
    q.forEach(id=>ranks.set(id,0));
    const vis=new Set(q);
    while(q.length){const cur=q.shift();adj.get(cur)?.forEach(next=>{if(!vis.has(next)){vis.add(next);q.push(next);}ranks.set(next,Math.max(ranks.get(next)??0,(ranks.get(cur)??0)+1));});}
    nodes.forEach((_,id)=>{if(!ranks.has(id))ranks.set(id,0);});
    return ranks;
  }

})();
</script>

<script type="text/plain" id="relic-src-spec"># Spec: HTML Spec Mode

**Spec ID:** 008-html-spec-mode
**Created:** 2026-05-19
**Status:** draft

---

## Overview

Relic specs are currently expressed exclusively as Markdown files. While Markdown is AI-native and git-friendly, it limits the richness of the LLM's output. This spec introduces a `mode` setting (`md` | `html`) that unlocks a complementary HTML layer alongside the existing Markdown files.

When `mode = "html"`, every AI workflow command that can mutate spec files gains a final HTML step: after completing its Markdown work, the LLM reads the spec's HTML file and enriches it with the full context of that session — charts, flow diagrams, dependency graphs, status views, and structured cross-references that Markdown cannot express. The HTML file grows with the spec; it is not a static compilation.

The key to low token cost is `base.html`: a self-contained component library that ships reusable JavaScript primitives for charts, flows, and diagrams, styled by an embedded utility CSS library (Tailwind standalone build or equivalent). When the LLM writes the HTML file, it makes short declarative calls to these pre-built components rather than authoring raw SVG or JS from scratch. `base.html` is the vocabulary; the HTML spec/fix file is the page that uses it. Both are committed — the HTML files are first-class artefacts that can replace or augment Markdown review.

The HTML layer applies to both spec files and fix documents. Each spec in HTML mode produces `<spec-id>.html` in its spec directory. Each fix document in HTML mode produces `<fix-id>.html` **instead of** `<fix-id>.md` — one file per fix, not two. When mode is `html`, the HTML file is the fix document; the `.md` format is mode-specific, not universal. Naming by ID means multiple HTML files can be open simultaneously without tab name collisions.

This spec also consolidates the per-project configuration file: `engines.json` (a bare JSON array) is replaced by `config.json` (a keyed object) hosting both the engines list and the mode setting, and `engines-registry.ts` is renamed to `project-config.ts` to reflect its broadened responsibility.

---

## Requirements

### Functional Requirements

**Config file migration**

- FR-1: `relic init` must write `.relic/config.json` (not `engines.json`) for new projects. Shape: `{ "engines": [], "mode": "md" }`.
- FR-2: `relic add-engine` and `relic upgrade` must read and write `config.json`. Backwards-compatible: if `engines.json` exists and `config.json` does not, migrate automatically on first read — read the array, write `config.json`, remove `engines.json`.
- FR-3: `config.json` is committed (not gitignored) — it is project-level configuration, not personal session state.
- FR-4: `packages/utility/src/engines-registry.ts` is renamed to `packages/utility/src/project-config.ts`. All exports are updated to match the broader responsibility (engines list + mode). Spec 004 (`UpgradeDomain.md`) must be updated to reflect this rename during plan/implement — flagged as a cross-artifact mutation.

**Mode CLI command**

- FR-5: `relic mode <md|html>` sets the `mode` field in `.relic/config.json`. Unknown values are rejected with a clear error.
- FR-6: `relic mode html` additionally scaffolds `.relic/base.html` from the embedded `templates/base.html` template **if the file does not already exist**. If it already exists it is left untouched — the user owns it after first write.
- FR-7: `relic mode` (no argument) prints the current mode in JSON: `{ "mode": "md" }`.

**Context command**

- FR-8: `relic context` JSON output includes a `mode` field reflecting the current value from `config.json`. AI workflow commands use this to determine whether the HTML step is active.

**HTML scaffold — spec files**

- FR-9: When `mode = "html"`, `relic scaffold` creates `<spec-id>.html` in the spec directory **if it does not already exist**. The file is `base.html` with spec title and ID substituted. `files_created` includes `<spec-id>.html` when it is created. The filename uses the spec ID (e.g. `008-html-spec-mode.html`) so multiple spec files can be open simultaneously without tab name collisions.
- FR-10: `<spec-id>.html` is never overwritten by the CLI after initial creation. The LLM is the sole writer from that point on.
- FR-11: When `mode = "md"` (default), scaffold behaviour is unchanged — no HTML file is created.

**HTML scaffold — fix documents**

- FR-12: When `mode = "html"`, `/relic.fix` creates `<fix-id>.html` in `.relic/fixes/` **instead of** `<fix-id>.md`. There is exactly one file per fix — the format is determined by mode at the time `/relic.fix` is run. Named by fix ID for tab-collision reasons.
- FR-13: `<fix-id>.html` is never overwritten by the CLI after initial creation. The LLM updates it via the HTML steps in `fix.md` and `solve.md` prompts.
- FR-13b: When `mode = "md"` (default), `/relic.fix` creates `<fix-id>.md` as defined by `FixDocumentContract.md` (spec 003). No `.html` file is created. The two modes are mutually exclusive — one file per fix, format determined by mode.

**AI workflow command HTML step — spec commands**

- FR-14: The prompt templates for `specify.md`, `clarify.md`, `plan.md`, `tasks.md`, and `implement.md` gain a conditional HTML step: *"If `relic context` shows `mode = "html"`, read `<spec-id>.html` and update it with enriched content reflecting the full work done in this session. Use the components from `base.html` (read its component inventory) to produce charts, flows, and structured sections."* The HTML step must be positioned **before** the `## When done, confirm` checklist (or equivalent terminal section) — it is the last substantive work step, not a postscript. The confirm checklist must include an HTML item: `If mode is "html": <spec-id>.html updated.`
- FR-15: The HTML step is the LLM's own synthesis. It is not a mechanical transcription of the Markdown. The intent is enrichment: richer structure, visualisations, cross-references.

**AI workflow command HTML step — fix commands**

- FR-16: `fix.md` must check mode at the very top (Step 0, before any file creation) via `relic context`. Based on `mode`, the agent commits to either `<fix-id>.html` (html) or `<fix-id>.md` (md) for the entire session. Step 5 branches on this decision — the fix document is created in the correct format from the start, not retroactively converted at the end. `solve.md` must also read mode in Step 1 and conditionally read `.html` or `.md` in Step 2.
- FR-17: When `mode = "html"`, the HTML fix document IS the fix document — it is not a complement to a `.md` file. All fields from `FixDocumentContract.md` (issue, root cause, proposed changes, changelog draft, status) are present in the HTML, rendered via `base.html` components.

**`base.html` component library**

- FR-18: `base.html` must define a full CSS custom property system (`--bg`, `--surface`, `--surface-2`, `--border`, `--text`, `--text-2`, `--text-3`, `--accent`, `--accent-bg`, `--code-bg`) for both light and dark themes. No CDN links. All styling is inline.
- FR-19: `base.html` must include self-contained reusable JS/HTML components for at minimum: charts (bar, pie, line), flow diagrams, status badges, chip tags, tables, callouts, and progress bars. All JS is embedded inline.
- FR-20: Each component must be invocable with a short, declarative API so that HTML authoring requires minimal tokens per visualisation.
- FR-21: `base.html` must include a `<template id="relic-docs">` element (inert, never rendered) listing all available components with their invocation syntax and the LLM authoring rules. **Must not use an HTML comment block** — Mermaid-style `-->` arrows in examples would prematurely terminate an HTML comment, breaking the document.
- FR-22: Spec HTML files (`<spec-id>.html`) and fix HTML files (`<fix-id>.html`) are **self-contained** — all component CSS and JS from `base.html` are embedded inline when the file is created. There is no runtime reference to an external `base.html`.
- FR-24: `base.html` must include a sticky header (`position: fixed`) containing: spec ID chip (left), spec title (centre-left), navigation links to `spec.md` / `plan.md` / `tasks.md` (right), and a dark mode toggle button (far right). Clicking a nav link must open the linked file **inline within the same page** using the embedded markdown reader — the browser must not navigate away to a raw text view. A `← back` button must appear in the header (replacing the nav links) while the reader is active; clicking it restores the original HTML view. The reader reads markdown from embedded `<script type="text/plain" id="relic-src-*">` source blocks (primary) with a `fetch()` fallback for HTTP-served files.
- FR-25: The dark mode toggle must switch a `data-theme="dark"` attribute on `<html>` and persist the preference in `localStorage`. The system must also respect `prefers-color-scheme: dark` as the default when no localStorage value is set. All CSS must use `var(--)` custom properties so dark mode is inherited by any custom HTML the LLM adds.
- FR-26: `base.html` must include a `<relic-chip>` component for compact inline metadata tags (spec IDs, file types, status labels, etc.) rendered in a monospace font with a coloured background. Colors: `default` (slate), `blue`, `green`, `amber`, `red`, `purple`.
- FR-27: `relic validate` must be updated to permit `<spec-id>.html` as a legal file in a spec folder when `mode = "html"`.
- FR-28: `<spec-id>.html` must contain three `<script type="text/plain">` source blocks (`relic-src-spec`, `relic-src-plan`, `relic-src-tasks`) with the current content of the corresponding Markdown files. The LLM populates these during every HTML step of every workflow command. `base.html` ships the three blocks as empty placeholders; `relic scaffold` does not pre-populate them (the LLM does so on first `specify`/`plan` run). Currently the preamble's "exactly four files" rule causes validate to flag it as illegal. This is an intersection: `validate.ts` is also in `touches_files` for specs 005 and 009 — coordinate via changelog before modifying.

**Template embedding**

- FR-23: `templates/base.html` is embedded by `scripts/embed-templates.ts` into `packages/core/src/generated/templates.ts` alongside the existing Markdown templates. No HTML file is accessed from disk at runtime.

### Non-Functional Requirements

- NFR-1: The `engines.json` → `config.json` migration is backwards-compatible and silent. Projects that have not yet run any 008 command must continue to work.
- NFR-2: `base.html` is written at most once by Relic; subsequent `relic mode html` calls skip it if it exists.
- NFR-3: `base.html` is fully self-contained — all JS and CSS are embedded inline, no external CDN links, works offline and in air-gapped environments.
- NFR-4: All new commands follow Constitution Principle V — JSON output by default, `--text` flag for human-readable output.
- NFR-5: No new runtime `dependencies` in `packages/cli-node/package.json`. Initial HTML file generation uses string interpolation in TypeScript.
- NFR-6: Per Constitution Principle II, the HTML update logic for workflow commands lives in `templates/prompts/*.md`, not in TypeScript.
- NFR-7: `<spec-id>.html` and `<fix-id>.html` are committed. They are first-class artefacts equivalent in standing to the Markdown files and may replace Markdown review.
- NFR-8: HTML files authored by the LLM must **synthesise** information — never mechanically transcribe Markdown. Each section must represent information in its most visual form (flow diagram instead of bullet list, table instead of prose, progress bar instead of count). Prompt templates must enforce this via explicit anti-transcription rules in the HTML step.

## User Stories

- As a developer, I want `relic mode html` to switch my project to HTML spec mode, so that every workflow command produces a richer named HTML file alongside the standard Markdown files.
- As a developer, I want spec and fix HTML files named by their ID, so that multiple tabs can be open simultaneously without name collisions.
- As a developer, I want HTML files committed alongside the Markdown files, so that they can serve as a richer alternative to Markdown review — with charts, flows, and diagrams.
- As an LLM agent, I want to know the project mode from `relic context`, so that I can decide whether to execute the HTML step at the end of a workflow command.
- As an LLM agent, I want a pre-built component library in `base.html` with CSS custom properties, so that I can write short declarative component calls rather than authoring raw SVG, JS, or verbose inline styles — and have any custom CSS I write automatically inherit dark mode.
- As a developer, I want a dark mode toggle in the HTML header, so that I can read spec files comfortably in any lighting condition without manually editing the file.
- As a developer, I want navigation links to `spec.md`, `plan.md`, `tasks.md` in the HTML header, so that I can move between the HTML view and the Markdown source without a file browser.
- As an LLM agent, I want every spec workflow command (specify, clarify, plan, tasks, implement) to have an HTML step, so that the HTML file stays in sync with the spec's current state after every session.
- As an LLM agent, I want the fix and solve commands to have an HTML step, so that fix documents are also richly visualised when HTML mode is active.
- As a developer, I want `.relic/base.html` to be customisable after first write, so that I can extend the component library with project-specific visualisations.
- As an adopter, I want my existing `engines.json` to be automatically migrated to `config.json`, so that upgrading Relic does not break my workflow.

## Decisions

- **OQ-1 resolved:** `engines-registry.ts` → `project-config.ts`. Intersection with spec 004 addressed via changelog entry at plan/implement time.
- **OQ-2 resolved:** `mode` is the confirmed name for the config key and CLI command.
- **OQ-3 resolved:** HTML files are living LLM-enriched documents, not static compilations. AI workflow commands write to them; CLI only creates the initial shell from `base.html`.
- **OQ-4 resolved:** `base.html` is the initial scaffold and component library; `<spec-id>.html` / `<fix-id>.html` are the spec/fix files that the LLM updates. CLI never overwrites them after creation.
- **OQ-5 resolved:** HTML files are committed. They are first-class artefacts equivalent in standing to the Markdown files.
- **Component docs decision (replaces original):** The component inventory is stored in a `<template id="relic-docs">` element — not an HTML comment. An HTML comment containing Mermaid-style `-->` arrows would prematurely terminate the comment, causing example diagrams to render as visible page content. `<template>` elements are inert and immune to this class of bug.
- **CSS architecture decision:** `base.html` uses a CSS custom property system (`--bg`, `--surface`, etc.) instead of hardcoded colour values, enabling dark mode via `data-theme` attribute toggling. Components' internal colours remain hardcoded for simplicity; the custom properties are for custom HTML authored by the LLM.
- **Dark mode decision:** Toggle persists in `localStorage` under `relic-theme`. System preference (`prefers-color-scheme`) is honoured as the default when no stored preference exists.
- **relic-chip decision:** A new `<relic-chip>` component is added for compact inline metadata tags (spec IDs, file types, short labels). Distinct from `<relic-status>` in that it uses monospace font, smaller padding, and is not meant to convey workflow state.
- **Self-contained loading decision:** Spec and fix HTML files embed all CSS/JS from `base.html` inline at creation time. They do not reference an external `base.html` at runtime. This ensures files open correctly regardless of where they are accessed from (git checkout, email attachment, etc.). The earlier design (relative reference to `../../base.html`) was dropped.
- **Anti-transcription decision:** The HTML step prompt sections in all 7 workflow templates include mandatory anti-transcription rules. The LLM must represent each section in its most visual form. If a section would look identical to the Markdown source, it must be reconsidered.
- **Naming decision:** HTML files are named by their ID (`<spec-id>.html`, `<fix-id>.html`), not generically, to avoid tab name collisions.
- **Fix HTML decision:** When `mode = "html"`, `/relic.fix` creates `<fix-id>.html` instead of `<fix-id>.md`. One file per fix; format determined by mode at creation time. The HTML document contains all fields from `FixDocumentContract.md` rendered via components. `HtmlComponentContract.md` supersedes `FixDocumentContract.md` for the HTML mode fix format. Spec 003's contract is not modified.
- **Command coverage decision:** All spec workflow commands (specify, clarify, plan, tasks, implement) and fix workflow commands (fix, solve) get the HTML step. There is no filesystem watcher — HTML stays in sync because all mutating commands update it.

## Architecture Overview

The implementation has three independent concerns that are layered on top of each other:

**1. Config infrastructure** — `engines-registry.ts` is renamed to `project-config.ts` and extended from a bare JSON array to a keyed `{ engines, mode }` object. All callers are updated. Auto-migration from `engines.json` → `config.json` happens on first read. The `mode` field is surfaced in `relic context` output so AI workflow commands can check it without reading the config file directly.

**2. HTML scaffold** — `relic scaffold` gains a mode-aware branch: when mode is `html`, it creates `<spec-id>.html` from the embedded `base.html` template if the file does not already exist. A new `relic mode` CLI command switches the mode and, for `html`, also scaffolds `.relic/base.html` from the same template. `templates/base.html` is a self-contained component library with embedded Tailwind CSS and Mermaid.js — no runtime CDN dependency. `embed-templates.ts` is extended to pick up `.html` files alongside `.md`.

**3. Prompt template HTML steps** — all seven workflow prompt files (`specify`, `clarify`, `plan`, `tasks`, `implement`, `fix`, `solve`) gain a conditional final section. The LLM checks `mode` from `relic context` and, if `html`, reads the relevant HTML file, updates it using `base.html` components, and writes it back. For fix/solve, when mode is `html` the HTML file replaces the `.md` entirely. No TypeScript business logic is added for the HTML content — this is purely prompt-driven (Constitution Principle II).

The three concerns are independent at the code level: config infrastructure has no dependency on the scaffold or prompt changes; the scaffold depends only on the config read; the prompt changes are pure text edits.

## Implementation Phases

### Phase 1 — Config infrastructure: `project-config.ts`

1. Create `packages/utility/src/project-config.ts`:
   - Type `ProjectConfig = { engines: string[]; mode: "md" | "html" }`.
   - `readProjectConfig(relicDir)`: reads `config.json`; if absent but `engines.json` exists, migrates silently (reads array → writes `config.json` with `{ engines, mode: "md" }` → removes `engines.json`); if neither exists, returns default `{ engines: [], mode: "md" }`.
   - `writeProjectConfig(relicDir, config)`: writes `config.json`.
   - Convenience helpers: `readEngines(relicDir)`, `writeEngines(relicDir, engines[])`, `readMode(relicDir)`, `writeMode(relicDir, mode)`.
2. Update `packages/utility/src/index.ts`: export all new functions from `project-config.ts`; remove `readEnginesRegistry` / `writeEnginesRegistry` exports.
3. Delete `packages/utility/src/engines-registry.ts` (after all callers are updated in step 4).
4. Update all callers:
   - `packages/core/src/commands/init.ts` — `writeEnginesRegistry` → `writeEngines`; write `config.json` not `engines.json`; update log line.
   - `packages/core/src/commands/upgrade.ts` — `readEnginesRegistry` → `readEngines`.
   - `packages/cli-node/src/bin.ts` — update import (if it imports directly).
   - `packages/cli-node/src/bin.debug.ts` — update import.
5. Rename `packages/utility/src/__tests__/engines-registry.test.ts` → `packages/utility/src/__tests__/project-config.test.ts`; update tests for the new shape and migration logic.

### Phase 2 — Extend `relic context` with `mode`

1. In `packages/core/src/commands/context.ts`:
   - Import `readMode` from `@relic/utility`.
   - Add `mode: "md" | "html"` to the `ContextResult` interface.
   - Populate `result.mode` by calling `readMode(relicDir)`.
   - Add `mode` to the `--text` output.
2. This amends `ContextResultContract.md` (owned by spec 003) — write a changelog entry at implement time.

### Phase 3 — New `relic mode` command

1. Create `packages/core/src/commands/mode.ts`:
   - `ModeOptions { value?: "md" | "html"; text?: boolean; relicDir?: string }`.
   - No argument: read and print `{ "mode": "md" }` (JSON default).
   - Argument: validate (`"md"` | `"html"`, reject anything else with clear error); call `writeMode(relicDir, value)`.
   - When switching to `html`: check for `.relic/base.html`; if absent, write it from `TEMPLATES["base.html"]`.
   - `--text` flag: human-readable single line.
2. Export `runMode` + `ModeOptions` from `packages/core/src/index.ts`.
3. Register `relic mode [value]` in `packages/cli-node/src/bin.ts` (production binary).
4. Register same in `packages/cli-node/src/bin.debug.ts`.

### Phase 4 — `templates/base.html` and embed pipeline

1. Create `templates/base.html`:
   - CSS custom property system (`--bg`, `--surface`, `--text`, `--border`, `--accent`, etc.) for light/dark themes — no Tailwind standalone (too large; custom properties are sufficient).
   - Dark mode: `data-theme` attribute on `<html>`, toggled by a header button; persisted in `localStorage`; defaults to `prefers-color-scheme`.
   - Sticky header: spec ID chip, title, nav links (spec.md / plan.md / tasks.md), dark mode toggle.
   - Custom elements: `<relic-chart>`, `<relic-flow>`, `<relic-status>`, `<relic-chip>`, `<relic-table>`, `<relic-callout>`, `<relic-progress>` — each self-contained.
   - `<relic-chip>`: compact monospace tag with 6 colour options (default/blue/green/amber/red/purple).
   - `<template id="relic-docs">` (not `<!-- -->` comment) for component inventory — immune to `-->` arrow sequences that would break an HTML comment.
   - Layout: `max-width: 900px` centred body, CSS utility classes (flex/grid/spacing/colour).
   - Template variables `{{SPEC_ID}}` and `{{TITLE}}` for substitution at scaffold time.
   - Spec/fix HTML files are **self-contained**: all CSS/JS embedded inline — no runtime reference to external `base.html`.
2. Update `scripts/embed-templates.ts`:
   - In `collectFiles`, change the filter from `.md` | `.sh` to also include `.html`.
   - No other changes needed — the file is already picked up at the key `"base.html"`.

### Phase 5 — Scaffold HTML in `scaffold.ts`

1. In `packages/core/src/commands/scaffold.ts`:
   - Import `readMode` from `@relic/utility`.
   - After creating the four standard spec files, if `readMode(relicDir) === "html"`:
     - Compute target path: `join(specDir, `${specId}.html`)`.
     - If file does not exist: substitute `{{SPEC_ID}}` and `{{TITLE}}` in `TEMPLATES["base.html"]` using `applyTemplate`; write result; push `"${specId}.html"` to `filesCreated`.
2. `ScaffoldResultContract.md` (spec 008 owns) is already updated — no changelog entry needed.

### Phase 6 — Prompt template HTML steps

Add a conditional "HTML step" section to the end of each of the seven prompt files. The key elements are:

1. Read `.relic/base.html` — open `<template id="relic-docs">` for the component inventory.
2. Read the spec/fix HTML file.
3. Update with **synthesised** content — apply anti-transcription rules (NFR-8):
   - Do NOT copy Markdown verbatim.
   - Replace bullet lists of steps with `<relic-flow>` diagrams.
   - Replace tabular prose with `<relic-table>`.
   - Replace counts with `<relic-progress>`.
   - Use `<relic-chip>` for inline metadata instead of parenthetical text.
   - Use `var(--)` custom properties for any custom CSS.
4. Write the updated file back.

The fix and solve commands follow the same pattern but:
- The HTML file path is `<fix-id>.html` in `.relic/fixes/` (not the spec dir).
- When mode is `html`, `fix.md` creates `<fix-id>.html` **instead of** `<fix-id>.md`.
- `solve.md` updates the HTML file's Status section to `solved` and marks changes as applied.

- `templates/prompts/fix.md`
- `templates/prompts/solve.md`

### Phase 7 — Update `UpgradeDomain.md` (cross-spec mutation)

Amend `shared/domains/UpgradeDomain.md` (owned by spec 004):
- Replace all references to `engines.json` → `config.json`.
- Replace `engines-registry.ts` → `project-config.ts`.
- Note that `config.json` shape is `{ engines, mode }` and that `readMode` / `readEngines` are the access functions.

Write a changelog entry for this cross-spec mutation.

### Phase 7b — Update `relic validate` for HTML mode *(blocked: resolve intersection first)*

1. In `packages/core/src/commands/validate.ts`:
   - When `mode = "html"`, permit `<spec-id>.html` as a legal file in spec folders (in addition to the four standard files).
   - This requires reading `mode` from `config.json` (via `readMode`) before running the file-count check.
2. **Intersection:** `validate.ts` is in `touches_files` for specs 005 and 009. Raise a changelog entry and coordinate with those specs before implementing. This phase is blocked until intersection is resolved.

<script>
/* ── Inline Markdown Reader ─────────────────────────────────────────────── */
(function () {

  /* Escape HTML special chars */
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* Undo the source-block escaping convention: "<\/script" → "</script" */
  function unescMd(s) { return s.replace(/<\\\/(script)/gi, '</$1'); }

  /* Inline formatting: code > bold > italic > links (order matters) */
  function inl(s) {
    return s
      .replace(/`([^`]+)`/g, (_,c) => `<code>${esc(c)}</code>`)
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  }

  /* Block markdown-to-HTML parser */
  function md2html(src) {
    const lines = src.split('\n');
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      /* Fenced code block */
      if (/^```/.test(line)) {
        const code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { code.push(esc(lines[i])); i++; }
        out.push(`<pre><code>${code.join('\n')}</code></pre>`);
        i++; continue;
      }

      /* Headings */
      const hm = line.match(/^(#{1,4}) (.+)/);
      if (hm) { out.push(`<h${hm[1].length}>${inl(hm[2])}</h${hm[1].length}>`); i++; continue; }

      /* Horizontal rule */
      if (/^---+\s*$|^\*\*\*+\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      /* Blockquote */
      if (/^> ?/.test(line)) {
        const bq = [];
        while (i < lines.length && /^> ?/.test(lines[i])) { bq.push(lines[i].replace(/^> ?/, '')); i++; }
        out.push(`<blockquote>${md2html(bq.join('\n'))}</blockquote>`);
        continue;
      }

      /* GFM pipe table */
      if (/^\|/.test(line)) {
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) {
          if (/^\|[-|: ]+\|$/.test(lines[i])) { i++; continue; }
          rows.push(lines[i].split('|').slice(1,-1).map(c=>c.trim()));
          i++;
        }
        if (rows.length) {
          const [head,...body] = rows;
          out.push(`<table><thead><tr>${head.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
        }
        continue;
      }

      /* Unordered list (incl. GFM task-list items) */
      if (/^[-*+] /.test(line)) {
        const items = [];
        while (i < lines.length && /^[-*+] /.test(lines[i])) {
          const tm = lines[i].match(/^[-*+] \[( |x|X)\] (.*)$/);
          if (tm) {
            const checked = tm[1].toLowerCase() === 'x' ? ' checked' : '';
            items.push(`<li class="rl-task"><input type="checkbox" disabled${checked}> ${inl(tm[2])}</li>`);
          } else {
            items.push(`<li>${inl(lines[i].replace(/^[-*+] /, ''))}</li>`);
          }
          i++;
        }
        out.push(`<ul>${items.join('')}</ul>`);
        continue;
      }

      /* Ordered list */
      if (/^\d+\. /.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\. /.test(lines[i])) {
          items.push(`<li>${inl(lines[i].replace(/^\d+\. /, ''))}</li>`); i++;
        }
        out.push(`<ol>${items.join('')}</ol>`);
        continue;
      }

      /* Empty line */
      if (!line.trim()) { i++; continue; }

      /* Paragraph — collect consecutive non-block lines */
      const para = [];
      while (
        i < lines.length && lines[i].trim() &&
        !/^[#>|`]/.test(lines[i]) &&
        !/^[-*+] /.test(lines[i]) &&
        !/^\d+\. /.test(lines[i]) &&
        !/^---+\s*$/.test(lines[i])
      ) { para.push(lines[i]); i++; }
      if (para.length) out.push(`<p>${inl(para.join('\n').replace(/\n/g, '<br>'))}</p>`);
    }
    return out.join('\n');
  }

  /* Open a markdown file in the reader panel.
     The spec body is hidden (not serialised and restored) so rendered
     components are never re-parsed — re-parsing rendered flows/callouts
     would corrupt them. */
  async function openReader(filename, srcId, label) {
    const hTitle = document.querySelector('#relic-header .h-title');
    const hNav   = document.querySelector('#relic-header .h-nav');
    const hBack  = document.getElementById('relic-back');
    const body   = document.getElementById('relic-body');
    if (!hTitle || !hNav || !hBack || !body) return;

    let wrap = document.getElementById('relic-reader-wrap');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.id = 'relic-reader-wrap';
      body.parentNode.insertBefore(wrap, body.nextSibling);
    }

    const origTitle = hTitle.textContent;

    /* 1. Try embedded source block */
    let md = null;
    const srcEl = document.getElementById(srcId);
    if (srcEl && srcEl.textContent.trim()) {
      md = unescMd(srcEl.textContent.trim());
    } else {
      /* 2. Try fetch (works on HTTP or Firefox file://) */
      try {
        const resp = await fetch(filename);
        if (resp.ok) md = await resp.text();
      } catch (_) { /* CORS on file:// — expected in Chrome */ }
    }

    if (md) {
      wrap.innerHTML = `<div id="relic-reader">${md2html(md)}</div>`;
    } else {
      const reader = document.createElement('div');
      reader.id = 'relic-reader';
      const msg = document.createElement('div');
      msg.className = 'reader-msg';
      msg.innerHTML = `
        <h2 style="margin-top:0"></h2>
        <p>The markdown source is not embedded in this file yet and could not be fetched
        (common when opening via <code>file://</code> in Chrome due to CORS restrictions).</p>
        <p>To fix: run any workflow command — the HTML step embeds the source automatically.
        Run <code>relic html-sync</code> first if this file was generated by an older Relic version.</p>
        <p><a target="_blank">Open in a new tab →</a></p>`;
      msg.querySelector('h2').textContent = filename;
      const link = msg.querySelector('a');
      link.href = filename;
      link.textContent = `Open ${filename} in a new tab →`;
      reader.appendChild(msg);
      wrap.innerHTML = '';
      wrap.appendChild(reader);
    }

    /* Switch view: hide spec body, show reader */
    body.style.display = 'none';
    wrap.style.display = '';

    /* Switch header: nav → back */
    hTitle.textContent = label;
    hNav.style.display = 'none';
    hBack.style.display = 'inline-flex';
    hBack.onclick = () => {
      wrap.style.display = 'none';
      body.style.display = '';
      hTitle.textContent = origTitle;
      hNav.style.display = '';
      hBack.style.display = 'none';
      hBack.onclick = null;
      window.scrollTo(0, 0);
    };

    window.scrollTo(0, 0);
  }

  /* Wire up nav links after DOM is ready */
  document.addEventListener('DOMContentLoaded', () => {
    const NAV = [
      { href: 'spec.md',   srcId: 'relic-src-spec',   label: 'spec.md'   },
      { href: 'plan.md',   srcId: 'relic-src-plan',   label: 'plan.md'   },
      { href: 'tasks.md',  srcId: 'relic-src-tasks',  label: 'tasks.md'  },
    ];
    NAV.forEach(({ href, srcId, label }) => {
      document.querySelectorAll(`a.h-link[href="${href}"]`).forEach(a => {
        a.addEventListener('click', e => { e.preventDefault(); openReader(href, srcId, label); });
      });
    });
  });

})();
</script>
