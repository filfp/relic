<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>011-skill-extraction — Skill Extraction</title>
  <style>
    /* ── CSS custom properties ────────────────────────────────────── */
    :root {
      --bg:        #f8fafc;
      --surface:   #ffffff;
      --surface-2: #f1f5f9;
      --border:    #e2e8f0;
      --border-2:  #cbd5e1;
      --text:      #1e293b;
      --text-2:    #475569;
      --text-3:    #94a3b8;
      --accent:    #3b82f6;
      --accent-bg: #eff6ff;
      --code-bg:   #f1f5f9;
      --hdr-h:     52px;
    }
    [data-theme="dark"] {
      --bg:        #0f172a;
      --surface:   #1e293b;
      --surface-2: #263248;
      --border:    #334155;
      --border-2:  #475569;
      --text:      #e2e8f0;
      --text-2:    #94a3b8;
      --text-3:    #64748b;
      --accent:    #60a5fa;
      --accent-bg: #1e3a5f;
      --code-bg:   #263248;
    }

    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 15px; line-height: 1.65;
      color: var(--text); background: var(--bg);
      padding-top: var(--hdr-h);
      transition: background 0.2s, color 0.2s;
    }

    /* ── Sticky header ────────────────────────────────────────────── */
    #relic-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--hdr-h);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 1.25rem; gap: 0.75rem;
      box-shadow: 0 1px 6px rgba(0,0,0,.06);
    }
    #relic-header .h-id {
      font-family: ui-monospace, monospace; font-size: 0.72rem; font-weight: 700;
      color: var(--accent); background: var(--accent-bg);
      padding: 2px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
    }
    #relic-header .h-title {
      font-size: 0.88rem; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    #relic-header .h-nav {
      display: flex; gap: 0.2rem; flex-shrink: 0;
    }
    #relic-header .h-link {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 3px 10px; border-radius: 5px; font-size: 0.76rem; font-weight: 500;
      color: var(--text-2); text-decoration: none;
      border: 1px solid var(--border); background: var(--surface-2);
      transition: all 0.15s; white-space: nowrap;
    }
    #relic-header .h-link:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
    #relic-header .h-toggle {
      background: none; border: 1px solid var(--border);
      border-radius: 5px; padding: 3px 9px; cursor: pointer;
      font-size: 0.95rem; line-height: 1.4; color: var(--text-2);
      transition: background 0.15s; flex-shrink: 0;
    }
    #relic-header .h-toggle:hover { background: var(--surface-2); }

    /* ── Layout ───────────────────────────────────────────────────── */
    #relic-body { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

    /* ── Typography ───────────────────────────────────────────────── */
    h1 { font-size: 1.55rem; font-weight: 700; color: var(--text); margin-bottom: 0.3rem; }
    h2 {
      font-size: 1.05rem; font-weight: 600; color: var(--text);
      margin: 2rem 0 0.7rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--border);
    }
    h3 { font-size: 0.92rem; font-weight: 600; color: var(--text-2); margin: 1.1rem 0 0.35rem; }
    p  { margin-bottom: 0.6rem; }
    a  { color: var(--accent); }
    code {
      font-family: ui-monospace, 'Cascadia Code', monospace; font-size: 0.82em;
      background: var(--code-bg); padding: 0.1em 0.4em; border-radius: 3px; color: var(--text);
    }
    pre {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 1rem; border-radius: 8px; overflow-x: auto;
      font-size: 0.81rem; margin: 0.75rem 0; line-height: 1.55;
    }
    pre code { background: none; padding: 0; font-size: inherit; }
    ul, ol { padding-left: 1.5rem; margin-bottom: 0.6rem; }
    li { margin-bottom: 0.2rem; }

    /* ── Cards ────────────────────────────────────────────────────── */
    section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem;
    }
    section > h2:first-child { margin-top: 0; }

    /* ── Meta ─────────────────────────────────────────────────────── */
    .meta {
      display: flex; gap: 1.25rem; flex-wrap: wrap; align-items: center;
      color: var(--text-3); font-size: 0.8rem; margin-bottom: 1.5rem;
    }

    /* ── Table ────────────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 0.865rem; }
    th {
      text-align: left; padding: 0.45rem 0.75rem;
      background: var(--surface-2); border-bottom: 2px solid var(--border);
      font-weight: 600; color: var(--text-2); white-space: nowrap;
    }
    td { padding: 0.45rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:nth-child(even) td { background: var(--surface-2); }
    tr:last-child td { border-bottom: none; }

    /* ── Utility classes ──────────────────────────────────────────── */
    .flex        { display: flex; }
    .flex-wrap   { flex-wrap: wrap; }
    .gap-2       { gap: 0.5rem; }
    .gap-4       { gap: 1rem; }
    .items-center{ align-items: center; }
    .justify-between { justify-content: space-between; }
    .text-sm     { font-size: 0.875rem; }
    .text-xs     { font-size: 0.75rem; }
    .font-mono   { font-family: ui-monospace, monospace; }
    .text-muted  { color: var(--text-2); }
    .text-subtle { color: var(--text-3); }
    .text-red    { color: #dc2626; }
    .text-green  { color: #16a34a; }
    .text-blue   { color: var(--accent); }
    .text-amber  { color: #d97706; }
    .mt-1 { margin-top: 0.25rem; }  .mt-2 { margin-top: 0.5rem; }  .mt-4 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.25rem; }.mb-2 { margin-bottom: 0.5rem; }.mb-4 { margin-bottom: 1rem; }
    .p-2  { padding: 0.5rem; }      .p-4  { padding: 1rem; }
    .rounded    { border-radius: 4px; }
    .rounded-md { border-radius: 6px; }
    .rounded-full{ border-radius: 9999px; }
    .border     { border: 1px solid var(--border); }
    .bg-surface { background: var(--surface); }
    .bg-surface-2{ background: var(--surface-2); }
    .w-full     { width: 100%; }
    .overflow-auto { overflow: auto; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }

    /* ── Markdown reader ──────────────────────────────────────────────── */
    #relic-reader { padding: 0.5rem 0 3rem; }
    #relic-reader h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); border-bottom: 2px solid var(--border); padding-bottom: 0.4rem; margin-bottom: 1.25rem; }
    #relic-reader h2 { font-size: 1.1rem; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; margin: 1.75rem 0 0.75rem; }
    #relic-reader h3 { font-size: 0.95rem; font-weight: 600; color: var(--text-2); margin: 1.25rem 0 0.5rem; }
    #relic-reader h4 { font-size: 0.875rem; font-weight: 600; color: var(--text-2); margin: 1rem 0 0.35rem; }
    #relic-reader p  { margin-bottom: 0.75rem; }
    #relic-reader ul, #relic-reader ol { padding-left: 1.5rem; margin-bottom: 0.75rem; }
    #relic-reader li { margin-bottom: 0.25rem; }
    #relic-reader blockquote { border-left: 3px solid var(--accent); background: var(--accent-bg); color: var(--text-2); padding: 0.5rem 1rem; margin: 0.75rem 0; border-radius: 0 6px 6px 0; }
    #relic-reader blockquote p { margin-bottom: 0; }
    #relic-reader hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    #relic-reader table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.875rem; }
    #relic-reader th { text-align: left; padding: 0.4rem 0.75rem; background: var(--surface-2); border-bottom: 2px solid var(--border); font-weight: 600; color: var(--text-2); }
    #relic-reader td { padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    #relic-reader tr:nth-child(even) td { background: var(--surface-2); }
    #relic-reader tr:last-child td { border-bottom: none; }
    #relic-reader .reader-msg { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-top: 1rem; }
    /* back button — hidden by default, shown in reader mode */
    .h-back { display: none; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>

<!--
  RELIC COMPONENTS REFERENCE
  ==========================
  Stored in a <template> element below — inert, never rendered.
  The LLM reads #relic-docs before authoring any spec/fix HTML section.
  Using <template> (not an HTML comment) prevents --> sequences in examples from
  breaking the document structure.
-->
<template id="relic-docs">
RELIC COMPONENTS
================
All components are custom elements. Use them anywhere inside <body>.

RELIC-STATUS  — coloured status badge
  <relic-status value="pending">Pending</relic-status>
  <relic-status value="in-progress">In Progress</relic-status>
  <relic-status value="done">Done</relic-status>
  <relic-status value="risk">Risk</relic-status>
  <relic-status value="draft">Draft</relic-status>
  Values: pending (slate), in-progress (blue), done (green), risk (red), draft (purple)

RELIC-CHIP  — compact inline metadata tag (code/label style)
  <relic-chip>tag</relic-chip>
  <relic-chip color="blue">spec-008</relic-chip>
  <relic-chip color="green">done</relic-chip>
  Colors: default (slate), blue, green, amber, red, purple

RELIC-CALLOUT  — highlighted block
  <relic-callout type="info">Informational message</relic-callout>
  <relic-callout type="warn">Warning message</relic-callout>
  <relic-callout type="risk">Risk / error message</relic-callout>
  <relic-callout type="success">Success message</relic-callout>

RELIC-PROGRESS  — labelled numeric progress bar (colour tracks completion)
  <relic-progress value="7" max="12" label="Tasks complete"></relic-progress>

RELIC-TABLE  — structured table from JSON
  <relic-table
    headers='["Column A","Column B","Column C"]'
    rows='[["r1a","r1b","r1c"],["r2a","r2b","r2c"]]'>
  </relic-table>
  Note: cell content is rendered as HTML — wrap plain text in <code> tags if needed.

RELIC-CHART  — SVG chart
  Bar:  <relic-chart type="bar"  labels='["A","B","C"]' data='[10,20,15]' title="Title"></relic-chart>
  Pie:  <relic-chart type="pie"  labels='["X","Y","Z"]' data='[40,35,25]' title="Split"></relic-chart>
  Line: <relic-chart type="line" labels='["Jan","Feb","Mar"]' data='[5,8,6]' title="Trend"></relic-chart>

RELIC-FLOW  — flow diagram (Mermaid-style graph syntax)
  <relic-flow>
  graph TD
  A[Start] --> B{Decision?}
  B -->|yes| C[Done]
  B -->|no| D[Retry]
  D --> B
  </relic-flow>
  Directions: TD (top-down)  LR (left-right)  RL  BT
  Node shapes: [box]  {diamond}  (circle)
  Edges: A --> B   A -->|label| B   A --- B

CSS UTILITIES (add as class= on any element)
  Spacing:  mt-1/2/4  mb-1/2/4  p-2/4  gap-2/4
  Text:     text-sm  text-xs  font-mono  text-muted  text-subtle
            text-red  text-green  text-blue  text-amber
  Layout:   flex  flex-wrap  items-center  justify-between  w-full
            grid-2  grid-3
  Visual:   border  rounded  rounded-md  bg-surface  bg-surface-2  overflow-auto
  Cards:    use <section> for a white card with border, rounded corners, padding

HEADER & DARK MODE
  The sticky header contains:
    • spec ID chip (left)
    • spec title (centre-left)
    • nav links: spec.md  plan.md  tasks.md — clicking opens the file INLINE (not raw text)
    • back button (hidden; shown when a .md file is open in the reader panel)
    • dark mode toggle (right) — persisted in localStorage
  All colours use CSS custom properties (--bg, --surface, --text, --border, --accent, etc.)
  so any custom CSS the LLM adds automatically inherits dark-mode support when it uses var(--*).

INLINE MARKDOWN READER
  The nav links open .md files in a styled reader panel within the same page.
  The reader reads from three embedded <script type="text/plain"> source blocks:
    #relic-src-spec   ← content of spec.md
    #relic-src-plan   ← content of plan.md
    #relic-src-tasks  ← content of tasks.md
  If a source block is empty, the reader falls back to fetch() (works on HTTP;
  blocked in Chrome on file:// due to CORS). If both fail, a graceful message is shown.

  LLM OBLIGATION: after updating the HTML sections, always embed the CURRENT content
  of spec.md, plan.md, and tasks.md into the three source blocks. This is the primary
  delivery path for the reader — fetch() is only a fallback.

LLM AUTHORING RULES
  1. DO NOT copy Markdown text verbatim into HTML.
  2. Each section MUST synthesise content into the most visual form available:
       flow diagram instead of a bulleted list of steps
       table instead of prose describing columns of data
       progress bar instead of "3 of 5 tasks complete"
       relic-chip badges for inline metadata instead of parenthetical text
  3. If a section would look identical to the Markdown source, you are doing it wrong.
  4. Prefer relic-* components over raw HTML. Use raw HTML only for layouts (grid, flex).
  5. Use CSS custom properties (var(--text), var(--surface), etc.) for any custom styles
     so they work in both light and dark modes.
  6. Always populate the three relic-src-* source blocks (see INLINE MARKDOWN READER above).
</template>

<script>
(function() {

  /* ── Dark mode ──────────────────────────────────────────────────── */
  const THEME_KEY = 'relic-theme';
  function getTheme() {
    return localStorage.getItem(THEME_KEY) ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem(THEME_KEY, t);
    const btn = document.getElementById('relic-toggle');
    if (btn) btn.textContent = t === 'dark' ? '☀' : '🌙';
  }
  applyTheme(getTheme());
  document.addEventListener('DOMContentLoaded', () => {
    applyTheme(getTheme());
    document.getElementById('relic-toggle')?.addEventListener('click', () =>
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
  });

  /* ── relic-status ───────────────────────────────────────────────── */
  const STATUS = {
    pending:      { bg:'#f1f5f9', border:'#cbd5e1', text:'#475569' },
    'in-progress':{ bg:'#dbeafe', border:'#93c5fd', text:'#1d4ed8' },
    done:         { bg:'#dcfce7', border:'#86efac', text:'#15803d' },
    risk:         { bg:'#fee2e2', border:'#fca5a5', text:'#b91c1c' },
    draft:        { bg:'#f3e8ff', border:'#d8b4fe', text:'#7c3aed' },
  };
  customElements.define('relic-status', class extends HTMLElement {
    connectedCallback() {
      const v = (this.getAttribute('value')||'pending').toLowerCase();
      const c = STATUS[v] || STATUS.pending;
      const label = this.textContent.trim() || v;
      this.innerHTML = `<span style="display:inline-block;padding:2px 10px;border-radius:9999px;font-size:0.72rem;font-weight:700;letter-spacing:0.03em;background:${c.bg};border:1px solid ${c.border};color:${c.text}">${label}</span>`;
    }
  });

  /* ── relic-chip ─────────────────────────────────────────────────── */
  const CHIP = {
    default:{ bg:'#f1f5f9', border:'#cbd5e1', text:'#475569' },
    blue:   { bg:'#dbeafe', border:'#93c5fd', text:'#1d4ed8' },
    green:  { bg:'#dcfce7', border:'#86efac', text:'#15803d' },
    amber:  { bg:'#fef3c7', border:'#fde68a', text:'#92400e' },
    red:    { bg:'#fee2e2', border:'#fca5a5', text:'#b91c1c' },
    purple: { bg:'#f3e8ff', border:'#d8b4fe', text:'#7c3aed' },
  };
  customElements.define('relic-chip', class extends HTMLElement {
    connectedCallback() {
      const c = CHIP[(this.getAttribute('color')||'default').toLowerCase()] || CHIP.default;
      const label = this.textContent.trim();
      this.innerHTML = `<span style="display:inline-block;padding:1px 7px;border-radius:4px;font-size:0.72rem;font-weight:600;font-family:ui-monospace,monospace;background:${c.bg};border:1px solid ${c.border};color:${c.text}">${label}</span>`;
    }
  });

  /* ── relic-callout ──────────────────────────────────────────────── */
  const CALLOUT = {
    info:   { bg:'#eff6ff', border:'#93c5fd', accent:'#3b82f6', icon:'ℹ' },
    warn:   { bg:'#fffbeb', border:'#fde68a', accent:'#f59e0b', icon:'⚠' },
    risk:   { bg:'#fff1f2', border:'#fecdd3', accent:'#f43f5e', icon:'✕' },
    success:{ bg:'#f0fdf4', border:'#86efac', accent:'#22c55e', icon:'✓' },
  };
  customElements.define('relic-callout', class extends HTMLElement {
    connectedCallback() {
      const s = CALLOUT[(this.getAttribute('type')||'info').toLowerCase()] || CALLOUT.info;
      const content = this.innerHTML;
      Object.assign(this.style, {
        display:'block', background:s.bg,
        border:`1px solid ${s.border}`, borderLeft:`4px solid ${s.accent}`,
        borderRadius:'7px', padding:'0.75rem 1rem', margin:'0.6rem 0', color:'#1e293b',
      });
      this.innerHTML = `<span style="font-weight:700;color:${s.accent};margin-right:0.5rem;font-size:0.88em">${s.icon}</span>${content}`;
    }
  });

  /* ── relic-progress ─────────────────────────────────────────────── */
  customElements.define('relic-progress', class extends HTMLElement {
    connectedCallback() {
      const val = parseInt(this.getAttribute('value')||'0',10);
      const max = parseInt(this.getAttribute('max')||'100',10);
      const label = this.getAttribute('label')||'';
      const pct = max > 0 ? Math.round((val/max)*100) : 0;
      const color = pct===100 ? '#22c55e' : pct>=60 ? '#3b82f6' : pct>=30 ? '#f59e0b' : '#ef4444';
      Object.assign(this.style, { display:'block', margin:'0.5rem 0' });
      this.innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:0.78rem;color:#64748b;margin-bottom:5px">
          <span>${label}</span><span style="font-weight:700;color:${color}">${pct}%</span>
        </div>
        <div style="background:#e2e8f0;border-radius:9999px;height:8px;overflow:hidden">
          <div style="background:${color};height:100%;border-radius:9999px;width:${pct}%;transition:width 0.4s ease"></div>
        </div>`;
    }
  });

  /* ── relic-table ────────────────────────────────────────────────── */
  customElements.define('relic-table', class extends HTMLElement {
    connectedCallback() {
      let headers, rows;
      try { headers = JSON.parse(this.getAttribute('headers')||'[]'); } catch { headers=[]; }
      try { rows = JSON.parse(this.getAttribute('rows')||'[]'); } catch { rows=[]; }
      Object.assign(this.style, { display:'block', overflowX:'auto', margin:'0.5rem 0' });
      const t = document.createElement('table');
      if (headers.length) {
        const tr = t.createTHead().insertRow();
        headers.forEach(h => { const th=document.createElement('th'); th.textContent=h; tr.appendChild(th); });
      }
      const tbody = t.createTBody();
      rows.forEach(row => {
        const tr = tbody.insertRow();
        (Array.isArray(row)?row:[row]).forEach(cell => { tr.insertCell().innerHTML = String(cell??''); });
      });
      this.innerHTML = '';
      this.appendChild(t);
    }
  });

  /* ── relic-chart ────────────────────────────────────────────────── */
  customElements.define('relic-chart', class extends HTMLElement {
    connectedCallback() {
      const type = this.getAttribute('type')||'bar';
      const title = this.getAttribute('title')||'';
      let labels, data;
      try { labels=JSON.parse(this.getAttribute('labels')||'[]'); } catch { labels=[]; }
      try { data=JSON.parse(this.getAttribute('data')||'[]'); } catch { data=[]; }
      Object.assign(this.style, { display:'block', margin:'0.5rem 0' });

      const W=500, H=280, PAD={top:40,right:20,bottom:64,left:52};
      const CW=W-PAD.left-PAD.right, CH=H-PAD.top-PAD.bottom;
      const nums=data.map(Number);
      const maxVal=Math.max(...nums,1);
      const COLORS=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316','#84cc16'];

      const mk=(tag,attrs={})=>{const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el;};
      const tx=(x,y,txt,a={})=>{const el=mk('text',{x,y,'font-size':'11','font-family':'system-ui',fill:'#64748b',...a});el.textContent=txt;return el;};
      const root=mk('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:'max-width:500px;display:block'});
      if(title) root.appendChild(tx(W/2,22,title,{'text-anchor':'middle','font-size':'14','font-weight':'600',fill:'#1e293b'}));

      if(type==='bar'){
        const barW=Math.max(8,CW/nums.length*0.55), gap=CW/nums.length;
        [0.25,0.5,0.75,1].forEach(n=>root.appendChild(mk('line',{x1:PAD.left,y1:PAD.top+CH-(n*CH),x2:PAD.left+CW,y2:PAD.top+CH-(n*CH),stroke:'#f1f5f9','stroke-width':'1'})));
        root.appendChild(mk('line',{x1:PAD.left,y1:PAD.top+CH,x2:PAD.left+CW,y2:PAD.top+CH,stroke:'#e2e8f0','stroke-width':'1'}));
        nums.forEach((v,i)=>{
          const bh=(v/maxVal)*CH, x=PAD.left+i*gap+gap/2-barW/2, y=PAD.top+CH-bh;
          root.appendChild(mk('rect',{x,y,width:barW,height:bh,fill:COLORS[i%COLORS.length],rx:'3'}));
          root.appendChild(tx(x+barW/2,PAD.top+CH+16,labels[i]||'',{'text-anchor':'middle','font-size':'10'}));
          if(v>0) root.appendChild(tx(x+barW/2,y-5,v,{'text-anchor':'middle','font-size':'10',fill:'#334155'}));
        });
      } else if(type==='line'){
        const pts=nums.map((v,i)=>[PAD.left+(i/Math.max(nums.length-1,1))*CW, PAD.top+CH-(v/maxVal)*CH]);
        root.appendChild(mk('line',{x1:PAD.left,y1:PAD.top+CH,x2:PAD.left+CW,y2:PAD.top+CH,stroke:'#e2e8f0','stroke-width':'1'}));
        if(pts.length>1){
          const areaD=`M${pts[0][0]},${PAD.top+CH} ${pts.map(p=>`L${p[0]},${p[1]}`).join(' ')} L${pts[pts.length-1][0]},${PAD.top+CH} Z`;
          root.appendChild(mk('path',{d:areaD,fill:COLORS[0]+'28',stroke:'none'}));
          root.appendChild(mk('path',{d:pts.map((p,i)=>`${i===0?'M':'L'}${p[0]},${p[1]}`).join(' '),stroke:COLORS[0],'stroke-width':'2.5',fill:'none','stroke-linejoin':'round','stroke-linecap':'round'}));
        }
        pts.forEach(([x,y],i)=>{
          root.appendChild(mk('circle',{cx:x,cy:y,r:'4',fill:'#fff',stroke:COLORS[0],'stroke-width':'2'}));
          root.appendChild(tx(x,PAD.top+CH+16,labels[i]||'',{'text-anchor':'middle','font-size':'10'}));
        });
      } else if(type==='pie'){
        const total=nums.reduce((a,b)=>a+b,0)||1;
        const cx=W/2, cy=PAD.top+CH/2, r=Math.min(CW,CH)/2-8;
        let angle=-Math.PI/2;
        nums.forEach((v,i)=>{
          const sweep=(v/total)*2*Math.PI;
          const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
          const x2=cx+r*Math.cos(angle+sweep),y2=cy+r*Math.sin(angle+sweep);
          root.appendChild(mk('path',{d:`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${sweep>Math.PI?1:0},1 ${x2},${y2} Z`,fill:COLORS[i%COLORS.length],stroke:'#fff','stroke-width':'2'}));
          const midA=angle+sweep/2;
          root.appendChild(tx(cx+(r*0.65)*Math.cos(midA),cy+(r*0.65)*Math.sin(midA),`${Math.round((v/total)*100)}%`,{'text-anchor':'middle',fill:'#fff','font-weight':'700','font-size':'11'}));
          angle+=sweep;
        });
        nums.forEach((_,i)=>{
          const ly=PAD.top+CH+14+Math.floor(i/3)*18, lx=PAD.left+(i%3)*140;
          root.appendChild(mk('rect',{x:lx,y:ly-8,width:10,height:10,fill:COLORS[i%COLORS.length],rx:'2'}));
          root.appendChild(tx(lx+14,ly,labels[i]||'',{}));
        });
      }
      this.innerHTML=''; this.appendChild(root);
    }
  });

  /* ── relic-flow ─────────────────────────────────────────────────── */
  customElements.define('relic-flow', class extends HTMLElement {
    connectedCallback() {
      const src = this.textContent.trim();
      this.innerHTML = '';
      try { this.appendChild(renderFlow(src)); }
      catch(e) { const p=document.createElement('pre'); p.textContent=src; this.appendChild(p); }
    }
  });

  function renderFlow(src) {
    const lines = src.split('\n').map(l=>l.trim()).filter(Boolean);
    let dir = 'LR';
    const dm = lines[0]?.match(/^(?:graph|flowchart)\s+(LR|TD|RL|BT)/i);
    if (dm) dir = dm[1].toUpperCase();

    const nodes = new Map(); // id -> { label, shape }
    const edges = [];        // { from, to, label }
    const parseNode = (id, label, shape) => {
      if (!nodes.has(id)) nodes.set(id, { label: label??id, shape: shape??'box' });
      else if (label) nodes.get(id).label = label;
    };

    const edgeRe = /([A-Za-z0-9_]+)(?:\[.*?\]|\{.*?\}|\(.*?\))?\s*(-{2,}>)\s*(?:\|([^|]*)\|)?\s*([A-Za-z0-9_]+)(?:\[([^\]]*)\]|\{([^}]*)\}|\(([^)]*)\))?/;
    for (const line of lines.slice(1)) {
      const em = line.match(edgeRe);
      if (em) {
        const fromM = line.match(/^([A-Za-z0-9_]+)(?:\[([^\]]*)\]|\{([^}]*)\}|\(([^)]*)\))?/);
        const toM   = line.match(/-{2,}>\s*(?:\|[^|]*\|)?\s*([A-Za-z0-9_]+)(?:\[([^\]]*)\]|\{([^}]*)\}|\(([^)]*)\))?/);
        if (fromM && toM) {
          const [,fId,fBox,fDiam,fCirc] = fromM;
          const [,tId,tBox,tDiam,tCirc] = toM;
          parseNode(fId, fBox??fDiam??fCirc, fDiam?'diamond':fCirc?'circle':'box');
          parseNode(tId, tBox??tDiam??tCirc, tDiam?'diamond':tCirc?'circle':'box');
          const lblM = line.match(/\|([^|]*)\|/);
          edges.push({ from:fId, to:tId, label:lblM?lblM[1]:'' });
        }
      } else {
        const nm = line.match(/^([A-Za-z0-9_]+)(?:\[([^\]]*)\]|\{([^}]*)\}|\(([^)]*)\))?$/);
        if (nm) parseNode(nm[1], nm[2]??nm[3]??nm[4], nm[3]?'diamond':nm[4]?'circle':'box');
      }
    }

    const horiz = dir==='LR'||dir==='RL';
    const nodeW=120, nodeH=38, rankGap=horiz?150:90, nodeGap=horiz?72:136;
    const ranks = rankNodes(nodes, edges);
    const rankGroups = new Map();
    nodes.forEach((_,id) => { const r=ranks.get(id)??0; if(!rankGroups.has(r))rankGroups.set(r,[]); rankGroups.get(r).push(id); });
    const pos = new Map();
    let svgW=0, svgH=0;
    rankGroups.forEach((ids,rank) => {
      ids.forEach((id,i) => {
        const x=horiz?rank*rankGap+24:i*nodeGap+24, y=horiz?i*nodeGap+24:rank*rankGap+24;
        pos.set(id,{x,y});
        svgW=Math.max(svgW,x+nodeW+40); svgH=Math.max(svgH,y+nodeH+60);
      });
    });

    const mk=(tag,attrs={})=>{const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el;};
    const root=mk('svg',{width:'100%',viewBox:`0 0 ${svgW} ${svgH}`,style:'max-width:640px;display:block;overflow:visible'});
    const defs=mk('defs');
    const marker=mk('marker',{id:'farr',markerWidth:'8',markerHeight:'8',refX:'7',refY:'3',orient:'auto'});
    const ap=mk('path'); ap.setAttribute('d','M0,0 L0,6 L8,3 z'); ap.setAttribute('fill','#94a3b8');
    marker.appendChild(ap); defs.appendChild(marker); root.appendChild(defs);

    edges.forEach(({from,to,label}) => {
      const fp=pos.get(from),tp=pos.get(to); if(!fp||!tp) return;
      const x1=fp.x+nodeW/2,y1=fp.y+nodeH/2,x2=tp.x+nodeW/2,y2=tp.y+nodeH/2;
      root.appendChild(mk('line',{x1,y1,x2,y2,stroke:'#94a3b8','stroke-width':'1.5','marker-end':'url(#farr)'}));
      if(label){const lt=mk('text');lt.setAttribute('x',(x1+x2)/2);lt.setAttribute('y',(y1+y2)/2-6);lt.setAttribute('text-anchor','middle');lt.setAttribute('font-size','10');lt.setAttribute('fill','#64748b');lt.setAttribute('font-family','system-ui');lt.textContent=label;root.appendChild(lt);}
    });

    const NF={box:'#eff6ff',diamond:'#fef3c7',circle:'#f0fdf4'};
    const NS={box:'#93c5fd',diamond:'#fbbf24',circle:'#86efac'};
    nodes.forEach(({label,shape},id)=>{
      const p=pos.get(id); if(!p) return;
      const {x,y}=p,cx=x+nodeW/2,cy=y+nodeH/2;
      if(shape==='diamond'){const poly=mk('polygon');poly.setAttribute('points',`${cx},${y} ${x+nodeW-2},${cy} ${cx},${y+nodeH} ${x+2},${cy}`);poly.setAttribute('fill',NF.diamond);poly.setAttribute('stroke',NS.diamond);poly.setAttribute('stroke-width','1.5');root.appendChild(poly);}
      else if(shape==='circle'){root.appendChild(mk('ellipse',{cx,cy,rx:nodeW/2,ry:nodeH/2,fill:NF.circle,stroke:NS.circle,'stroke-width':'1.5'}));}
      else{root.appendChild(mk('rect',{x:x+2,y,width:nodeW-4,height:nodeH,rx:'6',fill:NF.box,stroke:NS.box,'stroke-width':'1.5'}));}
      const t=mk('text');t.setAttribute('x',cx);t.setAttribute('y',cy+4);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','12');t.setAttribute('font-family','system-ui');t.setAttribute('fill','#1e293b');t.textContent=label.length>18?label.slice(0,16)+'…':label;root.appendChild(t);
    });
    return root;
  }

  function rankNodes(nodes, edges) {
    const inDeg=new Map([...nodes.keys()].map(id=>[id,0]));
    edges.forEach(({to})=>inDeg.set(to,(inDeg.get(to)??0)+1));
    const adj=new Map([...nodes.keys()].map(id=>[id,[]]));
    edges.forEach(({from,to})=>adj.get(from)?.push(to));
    const ranks=new Map();
    const q=[...nodes.keys()].filter(id=>(inDeg.get(id)??0)===0);
    q.forEach(id=>ranks.set(id,0));
    const vis=new Set(q);
    while(q.length){const cur=q.shift();adj.get(cur)?.forEach(next=>{if(!vis.has(next)){vis.add(next);q.push(next);}ranks.set(next,Math.max(ranks.get(next)??0,(ranks.get(cur)??0)+1));});}
    nodes.forEach((_,id)=>{if(!ranks.has(id))ranks.set(id,0);});
    return ranks;
  }

})();
</script>

<script type="text/plain" id="relic-src-spec"># Spec: Skill Extraction

**Spec ID:** 011-skill-extraction
**Created:** 2026-06-02
**Status:** draft

---

## Overview

Spec 010 introduced snippet injection — static text blocks extracted into reusable `<!-- include: relic snippet <name> -->` directives. That work left one problem unsolved: **procedural steps are trapped inside commands**. The artifact search cascade, for example, only fires when the user explicitly invokes `/relic.specify` or `/relic.plan`. If the LLM is working outside a relic command flow (debugging, implementing, answering a question), it has no access to those procedures.

This spec delivers **Track 2 — Skill extraction (proactive, standalone commands):** a `templates/skills/` directory of standalone procedure files written to `.claude/commands/` by `relic init`/`add-engine`. These skills can be invoked by the LLM **at any time** — not just inside a relic command flow — and command templates reference them by name via `<!-- use: relic.<skill-name> -->` directives instead of embedding the procedure inline.

The principle for this spec: **procedures → skills.**

**Prerequisite:** Spec 010-prompt-snippet-injection must be implemented first. Skills use `<!-- include: relic snippet <name> -->` directives for shared static context blocks.

---

## Delivery Track Classification

| Block | Current state | Track | Rationale |
|---|---|---|---|
| Artifact search cascade (Step A + Step B) | Embedded in specify, plan | **Skill** | 12-line procedure; useful any time the LLM needs to discover relevant artifacts, not just inside relic commands |
| Intersection check procedure | Embedded in specify, clarify, plan, tasks | **Skill** | Procedural; should fire whenever files are about to be modified, not just inside relic commands |

---

## Audit — Initial Skill Set

| Skill file | Procedure | Currently embedded in | After extraction |
|---|---|---|---|
| `search-context.md` | Two-step artifact discovery (Step A targeted search → Step B full brain scan fallback) | specify, plan (verbatim) | Standalone skill; specify and plan replace embedded procedure with `<!-- use: relic.search-context -->` |
| `check-intersections.md` | Load all `specs/*/artifacts.json`, compare `owns` and `touches_files` for conflicts | specify, clarify, plan, tasks (paraphrased) | Standalone skill; command templates use `<!-- use: relic.check-intersections -->` |

---

## Requirements

### Functional

- **FR-1:** A `templates/skills/` directory holds skill definition files. Each skill is a standalone procedure the LLM can invoke as a slash command, independent of any relic workflow command.
- **FR-2:** Skills are written to `.claude/commands/` by both `relic init` and `relic add-engine`, alongside the existing command files. They are first-class slash commands. The write logic routes through `packages/engines/src/engines/claude/index.ts` — the engines package layer — ensuring that extending to additional engines in future versions requires no changes to `init.ts` or `add-engine` logic directly.
- **FR-3:** Skills must be named to reflect their standalone utility (e.g., `relic.search-context`, `relic.check-intersections`) — not tied to a specific parent command.
- **FR-4:** Command templates that previously embedded a procedure inline must instead reference the skill by name using a `<!-- use: relic.<skill-name> -->` directive. This directive replaces both embedded procedure blocks and prose references ("Run `/relic.search-context` before proceeding."). The skill file is the single source of truth for that procedure.
- **FR-5:** Because skills appear in `.claude/commands/`, the LLM can invoke them at any time — when a user is debugging, reviewing, implementing, or doing anything where artifact knowledge is relevant — not only when they explicitly use a relic command.
- **FR-6:** Skills may use `<!-- include: relic snippet <name> -->` directives (to load shared static context blocks defined by spec 010) and `<!-- use: relic.<skill-name> -->` directives (to invoke other skills). Both are resolved by the LLM at runtime.
- **FR-7:** `templates/preamble.md` is updated to: (a) mandate `/relic.search-context` invocation via a `<!-- use: relic.search-context -->` directive, replacing the embedded search cascade; (b) document the directive system for the LLM — explaining that `<!-- include: relic snippet <name> -->` means "call `relic snippet <name>` and apply the result" and `<!-- use: relic.<skill-name> -->` means "invoke `/relic.<skill-name>` now."
- **FR-8:** `scripts/embed-engine-templates.ts` is extended to walk `templates/skills/*.md` and add those files to `ENGINE_TEMPLATES` with keys `skills/<name>.md`. `writeClaude()` detects skill keys by prefix and writes them to `.claude/commands/relic.<name>.md`. This is an additive change on top of spec 010's SNIPPETS registry bake.
- **FR-9:** The `<!-- use: relic.<skill-name> -->` directive applied in command templates is the canonical replacement for all prose instructions like "Run `/relic.search-context` before proceeding." All such prose references in command templates must be replaced with this directive form. The directive is an HTML comment — invisible in rendered Markdown, recognised by the LLM as a workflow instruction.

### Non-Functional

- **NFR-1:** After extraction, the total number of standalone `.claude/commands/` entries increases by exactly 2 (one per extracted skill). No existing command file is removed.
- **NFR-2:** Skill files are plain Markdown, editable without any tooling knowledge beyond a text editor.
- **NFR-3:** Both `relic init` and `relic add-engine` write skill files. No `relic add-skills` command — only first-party skills exist.

---

## User Stories

- As a Relic developer, I want to use `/relic.search-context` when I'm debugging a module — even though I never opened `/relic.fix` — so I can discover relevant contracts and domains without starting a relic workflow.
- As the LLM, I want to invoke `/relic.check-intersections` whenever I'm about to modify files in a relic project, regardless of which user prompt triggered the session, so I don't accidentally break owned artifacts.
- As a Relic maintainer, I want to update the intersection check procedure in one file and have it apply to all command templates automatically, so I never maintain the same logic in 4 places.

---

## Scope

### In Scope

- `templates/skills/` directory and the 2 skill files from the audit.
- Both `relic init` and `relic add-engine` write skills to `.claude/commands/` via `packages/engines/src/engines/claude/index.ts`.
- `scripts/embed-engine-templates.ts` — additive extension to walk `templates/skills/` and add skill entries to `ENGINE_TEMPLATES` (on top of spec 010's SNIPPETS bake).
- Command templates updated to replace prose skill references and embedded procedures with `<!-- use: relic.<skill-name> -->` directives.
- `templates/preamble.md` — replace embedded search cascade with `<!-- use: relic.search-context -->` and document both directive types for the LLM.
- Skills may use both `<!-- include: relic snippet <name> -->` and `<!-- use: relic.<skill-name> -->` directives.

### Out of Scope

- Snippet files and the `relic snippet` CLI command — handled by spec 010.
- Skill support for Copilot or Codex engines — v1 is Claude only; engines package is wired for future extension.
- Build-time directive resolution — directives remain LLM-runtime instructions.
- Third-party skill extension — only first-party skills exist in `templates/skills/`.

---

## Shared Artifacts

**Owns:**
- `shared/contracts/SkillExtractionContract.md` — skill definition rules, naming conventions, how skills are referenced from command templates, how they are written to AI engine directories, and the canonical skill registry. (Ownership transferred from spec 010 — see changelog.)

**Reads:**
- `shared/contracts/SnippetIncludeContract.md` (owned by 010) — directive syntax for `<!-- include: -->` and `<!-- use: -->`; skills use both forms.
- `shared/domains/TemplateDomain.md` (owned by 004) — governs how templates are embedded; the skill system extends this domain's build-time contract.

---

## Intersection Check

| File / artifact | Spec 011 action | Conflict? |
|---|---|---|
| `scripts/embed-engine-templates.ts` | Modify — add skill entries baking loop | Spec 010 also touches this (SNIPPETS bake). **Coordinated** — additive loop after existing SNIPPETS loop; applied after 010 is implemented. |
| `templates/prompts/*.md` | Modify — replace procedures with `<!-- use: -->` directives | Spec 010 also modifies these (snippet directives). **Coordinated** — additive, sequential; applied after 010's snippet replacements. |
| `templates/skills/` | Create — new directory | Entirely new path. No conflict. |
| `packages/engines/src/engines/claude/index.ts` | Add skill write loop (prefix detection) | Not listed in any other spec. No conflict. |
| `templates/preamble.md` | Replace search cascade with `<!-- use: relic.search-context -->` + directive docs | Not listed in any other spec's `touches_files`. No conflict. |
| `packages/engines/src/generated/engine-templates.ts` | Auto-generated — gains skill entries | Spec 010 also touches this. **Coordinated** — skill entries are an additive section alongside SNIPPETS export. |
| `shared/contracts/SkillExtractionContract.md` | Owns — ownership transferred from spec 010 | No conflict. |
| `shared/contracts/SnippetIncludeContract.md` | Read only | Owned by spec 010. No ownership claim. |
| `shared/domains/TemplateDomain.md` | Read only | Owned by spec 004. No ownership claim. |

---

## Decisions

- **Skill write via engines package:** `packages/engines/src/engines/claude/index.ts` owns the write logic, using prefix detection on ENGINE_TEMPLATES keys (`skills/<name>.md`). Future engines add a handler here; `init.ts` and `add-engine` remain unchanged.
- **Both `relic init` and `relic add-engine` write skills:** Both entry points must produce a complete, usable skill set. No `relic add-skills` command.
- **Preamble mandate:** `templates/preamble.md` removes the embedded search cascade and replaces it with an authoritative mandate to invoke `/relic.search-context`. The skill is the single source of truth for the cascade procedure.
- **`<!-- use: relic.<skill-name> -->` is the canonical form:** All prose references to skills are replaced with this directive in command templates. Machine-readable, invisible in rendered Markdown.
- **Claude only in v1:** Skills are written to `.claude/commands/` only. Copilot and Codex engines return an empty skill set.
- **Prerequisite on spec 010:** Skill files use `<!-- include: relic snippet preamble-guard -->` for their opening preamble. Spec 010 must be implemented first.

---

## Open Questions

- [ ] **OQ-1:** Are there additional skill candidates beyond `search-context` and `check-intersections`? Review all command templates at plan time for any remaining embedded procedures.
- [ ] **OQ-2:** Should 011 produce its own Phase 7 build verification step, or does it run the same `bun run build:templates` + relic init test from spec 010's plan?
</script>

<script>
/* ── Inline Markdown Reader ─────────────────────────────────────────────── */
(function () {

  /* Escape HTML special chars */
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* Inline formatting: code > bold > italic > links (order matters) */
  function inl(s) {
    return s
      .replace(/`([^`]+)`/g, (_,c) => `<code>${esc(c)}</code>`)
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  }

  /* Block markdown-to-HTML parser */
  function md2html(src) {
    const lines = src.split('\n');
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      /* Fenced code block */
      if (/^```/.test(line)) {
        const code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { code.push(esc(lines[i])); i++; }
        out.push(`<pre><code>${code.join('\n')}</code></pre>`);
        i++; continue;
      }

      /* Headings */
      const hm = line.match(/^(#{1,4}) (.+)/);
      if (hm) { out.push(`<h${hm[1].length}>${inl(hm[2])}</h${hm[1].length}>`); i++; continue; }

      /* Horizontal rule */
      if (/^---+\s*$|^\*\*\*+\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      /* Blockquote */
      if (/^> ?/.test(line)) {
        const bq = [];
        while (i < lines.length && /^> ?/.test(lines[i])) { bq.push(lines[i].replace(/^> ?/, '')); i++; }
        out.push(`<blockquote>${md2html(bq.join('\n'))}</blockquote>`);
        continue;
      }

      /* GFM pipe table */
      if (/^\|/.test(line)) {
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) {
          if (/^\|[-|: ]+\|$/.test(lines[i])) { i++; continue; }
          rows.push(lines[i].split('|').slice(1,-1).map(c=>c.trim()));
          i++;
        }
        if (rows.length) {
          const [head,...body] = rows;
          out.push(`<table><thead><tr>${head.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
        }
        continue;
      }

      /* Unordered list */
      if (/^[-*+] /.test(line)) {
        const items = [];
        while (i < lines.length && /^[-*+] /.test(lines[i])) {
          items.push(`<li>${inl(lines[i].replace(/^[-*+] /, ''))}</li>`); i++;
        }
        out.push(`<ul>${items.join('')}</ul>`);
        continue;
      }

      /* Ordered list */
      if (/^\d+\. /.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\. /.test(lines[i])) {
          items.push(`<li>${inl(lines[i].replace(/^\d+\. /, ''))}</li>`); i++;
        }
        out.push(`<ol>${items.join('')}</ol>`);
        continue;
      }

      /* Empty line */
      if (!line.trim()) { i++; continue; }

      /* Paragraph — collect consecutive non-block lines */
      const para = [];
      while (
        i < lines.length && lines[i].trim() &&
        !/^[#>|`]/.test(lines[i]) &&
        !/^[-*+] /.test(lines[i]) &&
        !/^\d+\. /.test(lines[i]) &&
        !/^---+\s*$/.test(lines[i])
      ) { para.push(lines[i]); i++; }
      if (para.length) out.push(`<p>${inl(para.join('\n').replace(/\n/g, '<br>'))}</p>`);
    }
    return out.join('\n');
  }

  /* Open a markdown file in the reader panel */
  async function openReader(filename, srcId, label) {
    const hTitle = document.querySelector('#relic-header .h-title');
    const hNav   = document.querySelector('#relic-header .h-nav');
    const hBack  = document.getElementById('relic-back');
    const body   = document.getElementById('relic-body');
    if (!hTitle || !hNav || !hBack || !body) return;

    const origTitle = hTitle.textContent;
    const origHTML  = body.innerHTML;

    /* 1. Try embedded source block */
    let md = null;
    const srcEl = document.getElementById(srcId);
    if (srcEl && srcEl.textContent.trim()) {
      md = srcEl.textContent.trim();
    } else {
      /* 2. Try fetch (works on HTTP or Firefox file://) */
      try {
        const resp = await fetch(filename);
        if (resp.ok) md = await resp.text();
      } catch (_) { /* CORS on file:// — expected in Chrome */ }
    }

    if (md) {
      body.innerHTML = `<div id="relic-reader">${md2html(md)}</div>`;
    } else {
      body.innerHTML = `<div class="reader-msg">
        <h2 style="margin-top:0">${filename}</h2>
        <p>The markdown source is not embedded in this file yet and could not be fetched
        (common when opening via <code>file://</code> in Chrome due to CORS restrictions).</p>
        <p>To fix: run any workflow command — the HTML step will embed the source automatically.</p>
        <p><a href="${filename}" target="_blank">Open ${filename} in a new tab →</a></p>
      </div>`;
    }

    /* Switch header: nav → back */
    hTitle.textContent = label;
    hNav.style.display = 'none';
    hBack.style.display = 'inline-flex';
    hBack.onclick = () => {
      body.innerHTML = origHTML;
      hTitle.textContent = origTitle;
      hNav.style.display = '';
      hBack.style.display = 'none';
      hBack.onclick = null;
    };

    window.scrollTo(0, 0);
  }

  /* Wire up nav links after DOM is ready */
  document.addEventListener('DOMContentLoaded', () => {
    const NAV = [
      { href: 'spec.md',   srcId: 'relic-src-spec',   label: 'spec.md'   },
      { href: 'plan.md',   srcId: 'relic-src-plan',   label: 'plan.md'   },
      { href: 'tasks.md',  srcId: 'relic-src-tasks',  label: 'tasks.md'  },
    ];
    NAV.forEach(({ href, srcId, label }) => {
      document.querySelectorAll(`a.h-link[href="${href}"]`).forEach(a => {
        a.addEventListener('click', e => { e.preventDefault(); openReader(href, srcId, label); });
      });
    });
  });

})();
</script>
