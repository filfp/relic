name: Test

on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build Relic 2.0 distribution assets
        run: bun run build:assets
      - run: bun run lint
      - run: bun run typecheck:source
      - run: bun run test:source
      - run: bun run test:distribution
