name: Test

on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build:engine-templates && bun run scripts/embed-templates.ts
      - run: bun run scripts/build-plugin.ts --check
      - run: bun run test
