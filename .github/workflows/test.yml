name: Test

on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: Build Relic 2.0 distribution assets
        run: bun run build:assets
      - run: bun run scripts/embed-skill.ts --check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:distribution
