name: Test

on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the distribution build runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-bun
      - name: Supply chain (pins, release floor, audit)
        uses: ./.github/actions/supply-chain
      - name: Supply-chain gate and install hook tests
        run: bun test ./.github/actions/supply-chain/check.test.ts ./.claude/hooks/guard-install.test.ts
      - name: Build Relic 2.0 distribution assets
        run: bun run build:assets
      - run: bun run lint
      - run: bun run typecheck:source
      - run: bun run test:source
      - run: bun run test:distribution
      - name: Install the minimum supported Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
      - name: Exercise the npm bundle on Node.js 18
        run: bun run test:node-runtime
