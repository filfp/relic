name: Tag release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/release-tag.yml
    with:
      check: bash scripts/release-check.sh
      targets: npm:publish-npm.yml pypi:publish-pypi.yml
      changelog: CHANGELOG.md
